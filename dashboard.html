<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>StochGrid AOS</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-title" content="StochGrid">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="StochGrid AOS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1116;
    --card: #161a22;
    --card2: #1b2029;
    --line: #2a313d;
    --text: #dce0e6;
    --dim: #828a96;
    --head: #fad264;
    --good: #50c878;
    --bad: #eb5a5a;
    --warn: #f0b43c;
    --buy: #5aa0ff;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
  body { padding: 20px 16px 40px; max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; color: var(--head); letter-spacing: .2px; }
  h1 span { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 8px; }
  #conn { font-size: 12px; color: var(--dim); font-family: var(--mono); }
  #conn.err { color: var(--bad); }

  .inst { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; overflow: hidden; }
  .inst-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--card2); }
  .sym { font-size: 18px; font-weight: 600; }
  .sym small { color: var(--dim); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; letter-spacing: .3px; }
  .pill.ok { background: rgba(80,200,120,.14); color: var(--good); }
  .pill.warn { background: rgba(240,180,60,.14); color: var(--warn); }
  .pill.bad { background: rgba(235,90,90,.16); color: var(--bad); }
  .seen { margin-left: auto; font-size: 12px; color: var(--dim); font-family: var(--mono); }
  .seen.off { color: var(--bad); font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
  .sec { background: var(--card); padding: 14px 16px; min-width: 0; }
  .sec h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 0 0 10px; font-weight: 500; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 13.5px; }
  .row .k { color: var(--dim); flex-shrink: 0; }
  .row .v { font-family: var(--mono); font-size: 13px; text-align: right; overflow-wrap: anywhere; }
  .big { font-family: var(--mono); font-size: 24px; font-weight: 500; margin: 2px 0 6px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .dim { color: var(--dim); } .buy { color: var(--buy); }

  .bar { height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; margin: 6px 0 4px; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; border-radius: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; padding: 4px 0 6px; }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 5px 0; border-top: 1px solid var(--line); font-family: var(--mono); }
  td:first-child { font-family: var(--sans); color: var(--dim); }
  th + th, td + td { padding-left: 10px; }

  .wide { grid-column: span 3; }
  .two { grid-column: span 2; }
  svg.eq { width: 100%; height: 120px; display: block; }
  .eq-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); font-family: var(--mono); margin-top: 4px; }
  .empty { padding: 60px 16px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 10px; line-height: 1.6; }

  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .tabs button { font: inherit; font-size: 13px; color: var(--dim); background: none; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .hidden { display: none !important; }

  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; }
  select { font: inherit; font-size: 14px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
  .scard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; min-width: 0; }
  .scard h3 { margin: 0 0 6px; font-size: 11px; font-weight: 500; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .scard .net { font-family: var(--mono); font-size: 20px; font-weight: 500; }
  .scard .pct { font-family: var(--mono); font-size: 13px; margin-bottom: 8px; }
  .scard .row { font-size: 12.5px; padding: 2px 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { font: inherit; font-size: 12.5px; background: var(--card); color: var(--dim); border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--card2); color: var(--text); }
  .note { font-size: 12px; color: var(--dim); line-height: 1.6; margin-top: 12px; }
  .btn { font: inherit; font-size: 14px; font-weight: 500; color: #0e1116; background: var(--head); border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .btn.danger { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1px rgba(235,90,90,.5); }
  .btn:disabled { opacity: .5; cursor: default; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .switch:first-child { border-top: 0; }
  .switch input { width: 42px; height: 24px; appearance: none; background: var(--card2); border: 1px solid var(--line); border-radius: 999px; position: relative; cursor: pointer; flex-shrink: 0; transition: background .15s; }
  .switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--dim); transition: transform .15s, background .15s; }
  .switch input:checked { background: rgba(80,200,120,.25); border-color: rgba(80,200,120,.5); }
  .switch input:checked::after { transform: translateX(18px); background: var(--good); }
  .recent-row { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
  .recent-row:first-child { border-top: 0; }
  .recent-row time { font-family: var(--mono); font-size: 12px; color: var(--dim); flex-shrink: 0; }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr 1fr; }
    .wide, .two { grid-column: span 2; }
  }
  @media (max-width: 600px) {
    body { padding: 14px 12px 32px; }
    .grid { grid-template-columns: 1fr; }
    .wide, .two { grid-column: span 1; }
    .seen { margin-left: 0; width: 100%; }
    .hm { display: none; }
    table { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>StochGrid AOS<span>webový panel</span></h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-live" aria-selected="true">Přehled</button>
    <button role="tab" id="tab-stats" aria-selected="false">Statistiky</button>
    <button role="tab" id="tab-notify" aria-selected="false">Upozornění</button>
  </div>
  <div id="conn">načítám…</div>
</header>
<main id="app"></main>
<section id="stats" class="hidden">
  <div class="toolbar">
    <label for="asset">Aktivum</label>
    <select id="asset"><option value="ALL">Všechna aktiva</option></select>
  </div>
  <div id="stats-body"><div class="empty">Načítám statistiky…</div></div>
</section>
<section id="notify" class="hidden">
  <div class="inst">
    <div class="inst-head">
      <div class="sym">Upozornění do telefonu</div>
      <span id="n-state" class="pill warn">zjišťuji…</span>
    </div>
    <div class="sec">
      <p id="n-hint" class="note" style="margin-top:0"></p>
      <div class="toolbar" style="margin-bottom:6px">
        <button id="n-toggle" class="btn">Zapnout na tomto zařízení</button>
        <button id="n-test" class="btn ghost hidden">Poslat zkušební upozornění</button>
      </div>
      <div id="n-prefs" class="hidden">
        <h2 style="margin-top:16px">Kdy upozornit</h2>
        <div id="n-list"></div>
      </div>
    </div>
    <div class="sec" style="border-top:1px solid var(--line)">
      <h2>Poslední upozornění</h2>
      <div id="n-recent" class="dim" style="font-size:13px">–</div>
    </div>
  </div>
</section>

<script>
const app = document.getElementById("app");
const conn = document.getElementById("conn");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function row(k, v, cls) {
  const r = el("div", "row");
  r.append(el("span", "k", k), el("span", "v " + (cls || ""), v));
  return r;
}
function num(x, d = 2) { return (typeof x === "number" && isFinite(x)) ? x.toFixed(d) : "–"; }
function signed(x, d = 2) { return (typeof x === "number" && isFinite(x)) ? (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(d) : "–"; }
function lvlClass(l) { return l === "ok" ? "good" : l === "warn" ? "warn" : l === "bad" ? "bad" : ""; }
function ratioClass(used, limit) {
  if (!limit) return "";
  if (used >= limit * 0.75) return "bad";
  if (used >= limit * 0.40) return "warn";
  return "good";
}
function ago(sec) {
  if (sec < 60) return sec + " s";
  if (sec < 3600) return Math.floor(sec / 60) + " min";
  if (sec < 86400) return Math.floor(sec / 3600) + " h";
  return Math.floor(sec / 86400) + " d";
}

function sparkline(points, cur) {
  const wrap = el("div");
  if (!points || points.length < 2) {
    wrap.append(el("div", "dim", "Křivka equity se zobrazí po několika aktualizacích."));
    return wrap;
  }
  const W = 600, H = 120, P = 4;
  const eq = points.map(p => p[1]), bal = points.map(p => p[2]);
  const all = eq.concat(bal.filter(x => typeof x === "number"));
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const t0 = points[0][0], t1 = points[points.length - 1][0] || t0 + 1;
  const x = t => P + (W - 2 * P) * (t - t0) / Math.max(1, t1 - t0);
  const y = v => P + (H - 2 * P) * (1 - (v - lo) / (hi - lo));
  const line = (vals) => points.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + " " + y(vals[i]).toFixed(1)).join(" ");
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("class", "eq");
  const up = eq[eq.length - 1] >= eq[0];
  const area = document.createElementNS(ns, "path");
  area.setAttribute("d", line(eq) + ` L ${x(t1).toFixed(1)} ${H} L ${x(t0).toFixed(1)} ${H} Z`);
  area.setAttribute("fill", up ? "rgba(80,200,120,.10)" : "rgba(235,90,90,.10)");
  const pb = document.createElementNS(ns, "path");
  pb.setAttribute("d", line(bal));
  pb.setAttribute("fill", "none");
  pb.setAttribute("stroke", "#828a96");
  pb.setAttribute("stroke-width", "1");
  pb.setAttribute("stroke-dasharray", "4 3");
  pb.setAttribute("vector-effect", "non-scaling-stroke");
  const pe = document.createElementNS(ns, "path");
  pe.setAttribute("d", line(eq));
  pe.setAttribute("fill", "none");
  pe.setAttribute("stroke", up ? "#50c878" : "#eb5a5a");
  pe.setAttribute("stroke-width", "1.6");
  pe.setAttribute("vector-effect", "non-scaling-stroke");
  svg.append(area, pb, pe);
  wrap.append(svg);
  const meta = el("div", "eq-meta");
  const fmt = t => new Date(t).toLocaleTimeString("cs-CZ", { hour: "2-digit", minute: "2-digit" });
  meta.append(el("span", "", fmt(t0)), el("span", "", "min " + num(lo) + " · max " + num(hi) + " " + (cur || "")), el("span", "", fmt(t1)));
  wrap.append(meta);
  return wrap;
}

function renderInstance(it) {
  const s = it.status || {};
  const acc = s.account || {};
  const bk = s.basket || {};
  const cur = acc.currency || "";
  const card = el("section", "inst");

  // hlavička
  const head = el("div", "inst-head");
  const sym = el("div", "sym", s.symbol || it.id);
  sym.append(el("small", "", (s.tf || "") + (s.version ? "  ·  v" + s.version : "")));
  head.append(sym);
  if (it.online) head.append(el("span", "pill " + (s.stateLevel || "ok"), s.state || "?"));
  else head.append(el("span", "pill bad", "OFFLINE"));
  const seen = el("span", "seen" + (it.online ? "" : " off"),
    it.online ? "aktualizováno před " + ago(it.ageSec) : "EA neposílá data " + ago(it.ageSec) + " – zkontrolujte MT4 / VPS");
  head.append(seen);
  card.append(head);

  const grid = el("div", "grid");

  // účet
  const a = el("div", "sec");
  a.append(el("h2", "", "Účet"));
  a.append(el("div", "big", num(acc.equity) + " " + cur));
  a.append(row("Balance", num(acc.balance) + " " + cur));
  const dd = acc.ddPct || 0, ddl = acc.ddLimit || 0;
  a.append(row("Ztráta účtu", num(dd) + " %" + (ddl ? "  / limit " + num(ddl, 1) + " %" : ""), ratioClass(dd, ddl)));
  if (ddl) {
    const b = el("div", "bar"), i = el("i");
    i.style.width = Math.min(100, dd / ddl * 100).toFixed(1) + "%";
    i.style.background = `var(--${ratioClass(dd, ddl) || "good"})`;
    b.append(i); a.append(b);
  }
  const day = acc.dayPct || 0;
  a.append(row("Dnes vč. otevřených", signed(-day) + " %", day > 0 ? "bad" : "good"));
  a.append(row("Spread", num(acc.spread, 1) + " p", acc.spreadHigh ? "bad" : ""));
  grid.append(a);

  // koš
  const k = el("div", "sec");
  k.append(el("h2", "", "Otevřený koš"));
  if (bk.count > 0) {
    k.append(el("div", "big " + (bk.pl >= 0 ? "good" : "bad"), signed(bk.pl) + " " + cur));
    k.append(row("Pozice", bk.count + " / " + bk.max + "  " + bk.dir, bk.dir === "BUY" ? "buy" : "bad"));
    k.append(row("Loty", num(bk.lots)));
    k.append(row("Průměrná cena", bk.avg || "–"));
    if (bk.tp) k.append(row("TP koše", bk.tp));
    if (bk.sl) k.append(row("Hard stop", bk.sl));
  } else {
    k.append(el("div", "big dim", "žádný"));
    k.append(row("Pozice", "0 / " + (bk.max || "–") + " – čeká na signál", "dim"));
  }
  grid.append(k);

  // stav a filtry
  const f = el("div", "sec");
  f.append(el("h2", "", "Stav a filtry"));
  f.append(row("Čas SEČ/SELČ", s.cetTime || "–"));
  f.append(row("Obchodní hodiny", s.hours || "–", s.inHours === false ? "warn" : ""));
  f.append(row("Zprávy", s.news || "–", s.newsBlocked ? "warn" : ""));
  f.append(row("Signál", s.signal || "–"));
  f.append(row("Poslední svíčka", s.lastBar || "–"));
  f.append(row("Vyhodnocení", s.evalText || "–", lvlClass(s.evalLevel)));
  f.append(row("Odstup", s.grid || "–"));
  f.append(row("Úrovně / HardStop", s.levels || "–", s.levelsOver ? "warn" : ""));
  if (s.adr) f.append(row("ADR", s.adr));
  if (s.adrDays) f.append(row("Rozsahy dní", s.adrDays, "dim"));
  grid.append(f);

  // zhodnocení
  const z = el("div", "sec two");
  z.append(el("h2", "", "Zhodnocení – " + (s.statsScope || "uzavřené obchody")));
  const t = el("table");
  const hr = el("tr");
  [["Období", ""], ["Zisk", ""], ["%", ""], ["Obchodů", ""], ["Ziskových", "hm"]]
    .forEach(([h, c]) => hr.append(el("th", c, h)));
  t.append(hr);
  (s.stats || []).forEach(r => {
    const tr = el("tr");
    const c = r.trades ? (r.profit >= 0 ? "good" : "bad") : "dim";
    tr.append(el("td", "", r.label),
      el("td", c, signed(r.profit) + " " + cur),
      el("td", c, signed(r.pct) + " %"),
      el("td", "", r.trades),
      el("td", "hm", r.trades ? num(r.winPct, 0) + " %" : "–"));
    t.append(tr);
  });
  z.append(t);
  grid.append(z);

  // equity
  const e = el("div", "sec");
  e.append(el("h2", "", "Equity (od spuštění panelu)"));
  e.append(sparkline(it.equity, cur));
  grid.append(e);

  // pozice
  if ((s.positions || []).length) {
    const p = el("div", "sec wide");
    p.append(el("h2", "", "Otevřené pozice"));
    const pt = el("table");
    const ph = el("tr");
    [["Ticket", "hm"], ["Typ", ""], ["Loty", ""], ["Cena", ""], ["SL", "hm"], ["TP", "hm"], ["Zisk", ""]]
      .forEach(([h, c]) => ph.append(el("th", c, h)));
    pt.append(ph);
    s.positions.forEach(o => {
      const tr = el("tr");
      tr.append(el("td", "hm", o.ticket),
        el("td", o.type === "BUY" ? "buy" : "bad", o.type),
        el("td", "", num(o.lots)),
        el("td", "", o.price),
        el("td", "hm", o.sl || "–"),
        el("td", "hm", o.tp || "–"),
        el("td", o.profit >= 0 ? "good" : "bad", signed(o.profit) + " " + cur));
      pt.append(tr);
    });
    p.append(pt);
    grid.append(p);
  }

  card.append(grid);
  return card;
}

async function refresh() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    app.replaceChildren();
    if (!d.instances.length) {
      const e = el("div", "empty");
      e.append(el("div", "", "Zatím nepřišla žádná data z MT4."),
               el("div", "", "Zkontrolujte, že je v EA vyplněná adresa a token a že je adresa povolená ve WebRequest."));
      app.append(e);
    } else {
      d.instances.forEach(it => app.append(renderInstance(it)));
    }
    conn.className = "";
    conn.textContent = "obnoveno " + new Date().toLocaleTimeString("cs-CZ");
  } catch (err) {
    conn.className = "err";
    conn.textContent = "spojení se serverem selhalo – zkouším znovu";
  }
}
// ================= Statistiky =================
const statsEl = document.getElementById("stats");
const statsBody = document.getElementById("stats-body");
const assetSel = document.getElementById("asset");
const tabLive = document.getElementById("tab-live");
const tabStats = document.getElementById("tab-stats");
let view = "live", level = "day", lastStats = null;
try { level = localStorage.getItem("sg_level") || "day"; } catch (e) {}

const MONTHS = ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const DAYS = ["ne","po","út","st","čt","pá","so"];
function keyLabel(k, lvl) {
  if (lvl === "day") {
    const [y, m, d] = k.split("-").map(Number);
    const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    return `${DAYS[wd]} ${d}. ${m}.`;
  }
  if (lvl === "week") { const [y, w] = k.split("-W"); return `${Number(w)}. týden ${y}`; }
  if (lvl === "month") { const [y, m] = k.split("-"); return `${MONTHS[Number(m) - 1]} ${y}`; }
  return k;
}

function ddText(r, cur) {
  if (!r.hasDD) return "–";
  return "−" + num(r.ddAbs) + " " + cur + (r.ddPct != null ? "  (" + num(r.ddPct) + " %)" : "");
}

function statCard(title, r, cur) {
  const c = el("div", "scard");
  c.append(el("h3", "", title));
  const cls = r.trades ? (r.net >= 0 ? "good" : "bad") : "dim";
  c.append(el("div", "net " + cls, signed(r.net) + " " + cur));
  c.append(el("div", "pct " + cls, r.pct != null ? signed(r.pct) + " %" : "–"));
  c.append(row("Obchodů", r.trades + (r.positions > r.trades ? "  (" + r.positions + " poz.)" : "")));
  c.append(row("Úspěšnost", r.winPct != null ? num(r.winPct, 0) + " %" : "–", r.winPct == null ? "dim" : r.winPct >= 50 ? "good" : "warn"));
  const ddc = r.hasDD && r.ddAbs > 0 ? "bad" : "dim";
  c.append(row("Max DD", r.hasDD ? "−" + num(r.ddAbs) + " " + cur : "–", ddc));
  c.append(row("Max DD %", r.hasDD && r.ddPct != null ? "−" + num(r.ddPct) + " %" : "–", ddc));
  return c;
}

function renderStats(d) {
  // výběr aktiva
  const prev = assetSel.value;
  assetSel.replaceChildren(new Option("Všechna aktiva", "ALL"));
  (d.options || []).forEach(o => assetSel.append(new Option(o.label, o.id)));
  assetSel.value = [...assetSel.options].some(o => o.value === prev) ? prev : "ALL";

  statsBody.replaceChildren();
  if (d.empty) {
    const e = el("div", "empty");
    e.append(el("div", "", "Zatím žádná historie obchodů."),
             el("div", "", "EA v1.60 ji pošle automaticky během minuty po spuštění."));
    statsBody.append(e);
    return;
  }
  const cur = d.currency || "";

  const cards = el("div", "cards");
  cards.append(statCard("Dnes", d.current.day, cur), statCard("Tento týden", d.current.week, cur),
               statCard("Tento měsíc", d.current.month, cur), statCard("Tento rok", d.current.year, cur),
               statCard("Celkem", d.current.total, cur));
  statsBody.append(cards);

  const box = el("section", "inst");
  const head = el("div", "inst-head");
  head.append(el("div", "sym", "Historie"));
  const seg = el("div", "seg");
  [["day", "Dny"], ["week", "Týdny"], ["month", "Měsíce"], ["year", "Roky"]].forEach(([v, t]) => {
    const b = el("button", "", t);
    b.setAttribute("aria-pressed", String(level === v));
    b.onclick = () => { level = v; try { localStorage.setItem("sg_level", v); } catch (e) {} renderStats(lastStats); };
    seg.append(b);
  });
  seg.style.marginLeft = "auto";
  head.append(seg);
  box.append(head);

  const wrap = el("div", "sec");
  const t = el("table");
  const hr = el("tr");
  [["Období", ""], ["Obch.", ""], ["Úspěš.", ""], ["Zisk " + cur, ""], ["%", "hm"], ["Max DD " + cur, ""], ["DD %", "hm"]]
    .forEach(([h, c]) => hr.append(el("th", c, h)));
  t.append(hr);
  const rowsData = (d.tables && d.tables[level]) || [];
  if (!rowsData.length) {
    const tr = el("tr"); const td = el("td", "", "Žádná data"); td.colSpan = 7; tr.append(td); t.append(tr);
  }
  rowsData.forEach(r => {
    const tr = el("tr");
    const c = r.trades ? (r.net >= 0 ? "good" : "bad") : "dim";
    tr.append(el("td", "", keyLabel(r.key, level)),
      el("td", "", r.trades),
      el("td", r.winPct == null ? "dim" : "", r.winPct != null ? num(r.winPct, 0) + " %" : "–"),
      el("td", c, signed(r.net)),
      el("td", c + " hm", r.pct != null ? signed(r.pct) + " %" : "–"),
      el("td", r.hasDD && r.ddAbs > 0 ? "bad" : "dim", r.hasDD ? "−" + num(r.ddAbs) : "–"),
      el("td", (r.hasDD && r.ddAbs > 0 ? "bad" : "dim") + " hm", r.hasDD && r.ddPct != null ? "−" + num(r.ddPct) + " %" : "–"));
    t.append(tr);
  });
  wrap.append(t);
  box.append(wrap);
  statsBody.append(box);

  const since = d.ddFrom ? new Date(d.ddFrom * 1000).toLocaleString("cs-CZ", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }) : null;
  statsBody.append(el("div", "note",
    "Obchod = koš, tedy pozice zavřené společně (první pozice + přikoupení). Úspěšnost = podíl ziskových košů. " +
    "Období podle kalendáře v Praze. Max DD = největší pokles od maxima v daném období, z hodinových údajů včetně otevřených pozic" +
    (d.filter === "ALL" ? " – pro všechna aktiva z equity celého účtu (v %)" : " – pro vybrané aktivum z P/L tohoto EA (v % z balance na začátku období)") +
    "." + (since ? " Drawdown se sleduje od " + since + "." : " Drawdown se začne sledovat po spuštění EA v1.60.")));
}

async function refreshStats() {
  try {
    const r = await fetch("/api/stats?symbol=" + encodeURIComponent(assetSel.value || "ALL"), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    lastStats = await r.json();
    renderStats(lastStats);
    conn.className = "";
    conn.textContent = "obnoveno " + new Date().toLocaleTimeString("cs-CZ");
  } catch (err) {
    conn.className = "err";
    conn.textContent = "statistiky se nepodařilo načíst – zkouším znovu";
  }
}

// ================= Upozornění =================
const notifyEl = document.getElementById("notify");
const tabNotify = document.getElementById("tab-notify");
const nState = document.getElementById("n-state"), nHint = document.getElementById("n-hint");
const nToggle = document.getElementById("n-toggle"), nTest = document.getElementById("n-test");
const nPrefs = document.getElementById("n-prefs"), nList = document.getElementById("n-list");
const nRecent = document.getElementById("n-recent");
let swReg = null, nCfg = null;

const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

function b64ToBytes(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
async function currentSub() {
  if (!swReg) return null;
  try { return await swReg.pushManager.getSubscription(); } catch (e) { return null; }
}
function readPrefs() {
  const p = {};
  nList.querySelectorAll("input[data-ev]").forEach((i) => (p[i.dataset.ev] = i.checked));
  return p;
}

async function renderNotify() {
  if (!pushSupported) {
    nState.className = "pill bad"; nState.textContent = "nepodporováno";
    nHint.textContent = isIOS
      ? "Na iPhonu fungují upozornění jen z aplikace přidané na plochu (Safari → Sdílet → Přidat na plochu) a v iOS 16.4 nebo novějším. Otevřete panel z ikony na ploše a zapněte je tady."
      : "Tento prohlížeč upozornění nepodporuje. Zkuste Chrome, Edge nebo Firefox.";
    nToggle.classList.add("hidden"); return;
  }
  try { nCfg = await api("/api/notify/config" + ((await currentSub()) ? "?endpoint=" + encodeURIComponent((await currentSub()).endpoint) : "")); }
  catch (e) { nHint.textContent = "Nepodařilo se načíst nastavení ze serveru."; return; }
  if (!nCfg.enabled) {
    nState.className = "pill bad"; nState.textContent = "na serveru vypnuto";
    nHint.textContent = "Server zatím nemá nastavené klíče pro upozornění."; nToggle.classList.add("hidden"); return;
  }
  const sub = await currentSub();
  const perm = Notification.permission;
  if (sub && perm === "granted") {
    nState.className = "pill ok"; nState.textContent = "zapnuto";
    nToggle.textContent = "Vypnout na tomto zařízení"; nToggle.className = "btn danger";
    nTest.classList.remove("hidden"); nPrefs.classList.remove("hidden");
    nHint.textContent = "Upozornění chodí na toto zařízení" + (nCfg.devices > 1 ? ` a dalších ${nCfg.devices - 1}` : "") + ". Vyberte, o čem chcete vědět:";
  } else {
    nState.className = perm === "denied" ? "pill bad" : "pill warn";
    nState.textContent = perm === "denied" ? "zablokováno" : "vypnuto";
    nToggle.textContent = "Zapnout na tomto zařízení"; nToggle.className = "btn";
    nToggle.disabled = perm === "denied";
    nTest.classList.add("hidden"); nPrefs.classList.add("hidden");
    nHint.textContent = perm === "denied"
      ? "Upozornění jsou pro tento web v nastavení telefonu/prohlížeče zakázaná. Povolte je tam a stránku obnovte."
      : (isIOS && !isStandalone
          ? "Na iPhonu otevřete panel z ikony na ploše (Safari → Sdílet → Přidat na plochu), jinak iOS upozornění nedovolí."
          : "Telefon vás požádá o povolení upozornění – potvrďte Povolit.");
  }
  // přepínače
  nList.replaceChildren();
  const prefs = nCfg.prefs || {};
  for (const [k, label] of Object.entries(nCfg.events || {})) {
    const row = el("label", "switch");
    const inp = document.createElement("input");
    inp.type = "checkbox"; inp.dataset.ev = k; inp.checked = prefs[k] !== false;
    inp.onchange = async () => { const s = await currentSub(); if (s) await api("/api/notify/subscribe", { subscription: s.toJSON(), prefs: readPrefs() }); };
    row.append(el("span", "", label), inp);
    nList.append(row);
  }
  // poslední upozornění
  nRecent.replaceChildren();
  if (!(nCfg.recent || []).length) nRecent.textContent = "Zatím žádná.";
  (nCfg.recent || []).forEach((r) => {
    const d = el("div", "recent-row");
    const t = el("time", "", new Date(r.t).toLocaleString("cs-CZ", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }));
    const tx = el("div"); tx.append(el("div", "", r.title), el("div", "dim", r.body));
    d.append(t, tx); nRecent.append(d);
  });
}

nToggle.onclick = async () => {
  nToggle.disabled = true;
  try {
    const sub = await currentSub();
    if (sub && Notification.permission === "granted") {
      await api("/api/notify/unsubscribe", { endpoint: sub.endpoint }).catch(() => {});
      await sub.unsubscribe();
    } else {
      const perm = await Notification.requestPermission();
      if (perm === "granted") {
        const s = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(nCfg.publicKey) });
        await api("/api/notify/subscribe", { subscription: s.toJSON(), prefs: null });
      }
    }
  } catch (e) {
    nHint.textContent = "Nepodařilo se změnit nastavení: " + e.message;
  }
  nToggle.disabled = false;
  renderNotify();
};
nTest.onclick = async () => {
  nTest.disabled = true;
  const s = await currentSub();
  try {
    const r = await api("/api/notify/test", { endpoint: s.endpoint });
    nTest.textContent = r.ok ? "Odesláno ✔" : "Nepodařilo se odeslat (" + r.code + ")";
  } catch (e) { nTest.textContent = "Chyba odeslání"; }
  setTimeout(() => { nTest.textContent = "Poslat zkušební upozornění"; nTest.disabled = false; }, 4000);
};

// service worker + obnova registrace na serveru při každém otevření (server po restartu zapomíná)
if (pushSupported) {
  navigator.serviceWorker.register("/sw.js").then(async (reg) => {
    swReg = reg;
    const s = await currentSub();
    if (s && Notification.permission === "granted") api("/api/notify/subscribe", { subscription: s.toJSON(), prefs: null }).catch(() => {});
    if (view === "notify") renderNotify();
  }).catch(() => {});
}

function setView(v) {
  view = v;
  tabLive.setAttribute("aria-selected", String(v === "live"));
  tabStats.setAttribute("aria-selected", String(v === "stats"));
  tabNotify.setAttribute("aria-selected", String(v === "notify"));
  app.classList.toggle("hidden", v !== "live");
  statsEl.classList.toggle("hidden", v !== "stats");
  notifyEl.classList.toggle("hidden", v !== "notify");
  try { localStorage.setItem("sg_view", v); } catch (e) {}
  if (v === "live") refresh(); else if (v === "stats") refreshStats(); else renderNotify();
}
tabLive.onclick = () => setView("live");
tabStats.onclick = () => setView("stats");
tabNotify.onclick = () => setView("notify");
assetSel.onchange = refreshStats;

let startView = "live";
try { startView = localStorage.getItem("sg_view") || "live"; } catch (e) {}
setView(startView);
function tick() { if (view === "live") refresh(); else if (view === "stats") refreshStats(); }
setInterval(tick, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
