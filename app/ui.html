<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MG Property</title>
<meta name="theme-color" content="#1F5C4A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F5C4A'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' font-weight='700' text-anchor='middle' fill='%23FF6B4A'%3EMG%3C/text%3E%3C/svg%3E">
<style>
:root{--paper:#EEF4F0;--card:#F9FCFA;--ink:#14201B;--mut:#5B6B63;--line:#D5E2DA;--acc:#1F5C4A;--onacc:#ffffff;--ok:#1F5C4A;--okB:#DDF2E6;--warn:#7A5A00;--warnB:#FFF1C9;--bad:#B4441F;--badB:#FFE3DA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0B1512;--card:#162A24;--ink:#EAF4EE;--mut:#9DB3A8;--line:#1E3430;--acc:#6FD3B0;--onacc:#0B1512;--ok:#8EE3C4;--okB:#1F4A3D;--warn:#F5D680;--warnB:#43391A;--bad:#FF9A7E;--badB:#4A2A21}}
:root[data-theme="dark"]{--paper:#0B1512;--card:#162A24;--ink:#EAF4EE;--mut:#9DB3A8;--line:#1E3430;--acc:#6FD3B0;--onacc:#0B1512;--ok:#8EE3C4;--okB:#1F4A3D;--warn:#F5D680;--warnB:#43391A;--bad:#FF9A7E;--badB:#4A2A21}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-left:118px}
h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:30px;margin:6px 0 4px}
h2{font-size:20px;margin:26px 0 10px}
h3{font-size:17px;margin:0 0 10px}
main{max-width:760px;margin:0 auto;padding:18px 16px}
.mut{color:var(--mut)}.small{font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.item{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kpis,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px;font-size:14px}
.mini span{display:block;font-size:13px;color:var(--mut)}
.tag{font-size:13px;padding:3px 11px;border-radius:99px;white-space:nowrap;display:inline-block}
.tag.ok{background:var(--okB);color:var(--ok)}.tag.warn{background:var(--warnB);color:var(--warn)}.tag.bad{background:var(--badB);color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.link{background:none;border:0;color:var(--acc);font:inherit;padding:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mut);font-weight:500}
.r{text-align:right}
tfoot td{border-bottom:0;padding-top:12px}
.final{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:14px;border-radius:12px;font-size:17px}
.final.bad{background:var(--badB)}.final.ok{background:var(--okB)}
.final b{font-size:24px}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line.sum{font-weight:700;border-bottom:0}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,select,textarea{font:inherit;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(20,30,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.doc{white-space:pre-wrap;font:14px/1.6 Georgia,"Times New Roman",serif;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.resRow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
nav{position:fixed;left:0;top:0;bottom:0;width:118px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:14px 10px;z-index:5}
nav button.brand{background:none;border:0;padding:4px 4px 10px;margin:0 0 4px;text-align:left;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;color:var(--acc);font-size:16px;line-height:1.2;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer}
nav button.brand:hover{color:var(--ink)}
nav button{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 10px;color:var(--ink);font:inherit;font-size:15px;text-align:left;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
nav button.theme{margin-top:auto;font-size:13px;color:var(--mut)}
@media (max-width:560px){
 body{padding-left:84px}
 nav{width:84px;padding:10px 8px}
 nav button.brand{font-size:13px;text-align:center;padding:4px 2px 10px}
 nav button:not(.brand){font-size:13px;padding:12px 6px;text-align:center}
 main{padding:14px 12px}
}
.toast{position:fixed;left:calc(50% + 59px);transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--mut);margin-top:14px}
.warnTxt{color:var(--warn)}
/* Kolečko složené z čárek při hledání u všech bytů */
.cspin{position:relative;display:inline-block;width:18px;height:18px;vertical-align:middle;margin-right:10px;animation:cspin 1s linear infinite;flex:0 0 auto}
.cspin i{position:absolute;left:50%;top:50%;width:2.5px;height:6px;margin:-3px 0 0 -1.25px;border-radius:2px;background:var(--acc)}
@keyframes cspin{to{transform:rotate(360deg)}}
.bstat{display:flex;align-items:center;min-height:22px;margin:4px 0 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){.cspin{animation-duration:2.5s}}
/* Hodnota portfolia: fialový panel s podsvícením */
.pwidget{position:relative;margin:4px auto 18px;max-width:440px;text-align:center;padding:18px 18px 16px;border-radius:20px;background:radial-gradient(120% 140% at 50% 0%,#2A1656 0%,#0C0818 62%);border:1px solid #7C3AED;box-shadow:0 0 0 1px rgba(168,85,247,.25),0 0 30px rgba(139,92,246,.45),0 0 70px rgba(139,92,246,.18);color:#E9D5FF;cursor:pointer}
.pwidget .pl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C4B5FD}
.pwidget .pv{font-size:34px;font-weight:800;color:#F3E8FF;text-shadow:0 0 12px rgba(192,132,252,.9),0 0 26px rgba(139,92,246,.7);font-variant-numeric:tabular-nums;margin:6px 0 4px}
.pwidget .pv.pvl{font-size:44px}
.pwidget .pc{font-size:14px;color:#C4B5FD}
.pwidget.fixed{cursor:default}
/* Sloupcový graf hodnoty bytů */
.vwrap{overflow-x:auto;padding:18px 12px 12px}
.vrow{display:flex;align-items:flex-end;gap:12px;min-height:280px;min-width:100%}
.vcol{flex:1 1 0;min-width:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center}
.vval{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:2px;white-space:nowrap}
.vchg{font-size:11px;margin-bottom:4px;white-space:nowrap}
.vbar{width:100%;max-width:64px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 45%,transparent))}
.vbar.none{background:none;border:2px dashed var(--line);min-height:8px}
.vname{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.25;max-width:96px;word-break:break-word}
</style>
</head>
<body>
<main id="main"><p class="mut">Načítám…</p></main>
<button id="verBtn" title="Zkontrolovat novou verzi" onclick="checkForUpdate()" style="position:fixed;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:var(--paper);font:inherit;font-weight:800;font-size:13px;cursor:pointer;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.2)">MG</button>
<nav>
<button class="brand" onclick="go('home')" title="Na hlavní stránku"><span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--paper);font-weight:800;font-size:12px;margin-bottom:6px">MG</span><br>MG Property</button>
<button data-t="home" onclick="go('home')">Přehled</button>
<button data-t="econ" onclick="go('econ')">Ekonomika</button>
<button data-t="value" onclick="go('value')">Hodnota</button>
<button data-t="flats" onclick="go('flats')">Byty</button>
<button data-t="docs" onclick="go('docs')">Dokumenty</button>
<button data-t="bench" onclick="go('bench')">Benchmark</button>
<button data-t="mail" onclick="go('mail')">Upomínky</button>
<button data-t="hist" onclick="go('hist')">Historie</button>
<button class="theme" id="themeBtn" onclick="toggleTheme()">☾ Noční režim</button>
</nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const kc=n=>Math.round(n||0).toLocaleString('cs-CZ')+' Kč';
const fd=s=>{if(!s)return'—';const d=new Date(s);return isNaN(d)?'—':d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const costs=it=>it.reduce((s,r)=>s+(+r[1]||0),0);
const paid=it=>it.reduce((s,r)=>s+(+r[2]||0),0);
const bal=y=>paid(y.items)-costs(y.items);
const TODAY=new Date();
const years=f=>Object.keys(f.years).map(Number).sort((a,b)=>b-a);
const flat=id=>S.flats.find(f=>f.id==id);

let S={flats:[],versions:[],docs:[],econ:null};
let V={tab:'home',flat:null,year:null};
let pending=null;

// ---------- komunikace se serverem ----------
async function api(path,method='GET',body){
 const opt={method,headers:{}};
 if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
 const r=await fetch(path,opt);
 if(r.status===401)throw new Error('Nejste přihlášen. Obnovte stránku a zadejte jméno a heslo.');
 if(!r.ok){
  let d='Chyba '+r.status;
  try{const j=await r.json();if(typeof j.detail==='string')d=j.detail;else if(j.detail&&j.detail.message)d=j.detail.message;}catch(e){}
  throw new Error(d);
 }
 return r.status===204?null:r.json();
}

// převod z formátu API do tvaru, se kterým pracuje rozhraní
function toFlat(f){
 return {id:f.id,addr:f.addr,dispo:f.dispo||'',floor:f.floor||'',zip:f.zip||'',owner:f.owner||'',
  tenant:{name:f.tenant.name||'',email:f.tenant.email||'',phone:f.tenant.phone||'',others:f.tenant.others||[]},
  bank:{acc:f.bank_acc||''},
  leases:f.leases.map(l=>({id:l.id,from:l.valid_from,to:l.valid_to||'',rent:l.rent,kauce:l.deposit,adv:l.advances||{}})),
  svj:(f.svj_costs||[]).map(c=>({id:c.id,name:c.name,amount:c.amount})),
  acq:f.acquisition||null,
  area_m2:f.area_m2,
  years:Object.fromEntries(f.statements.map(st=>[st.year,{doc:st.doc_label,items:st.items.map(i=>[i.name,i.cost,i.paid])}]))};
}
async function reload(){
 const [flats,versions,docs,econ]=await Promise.all([api('/flats'),api('/versions'),api('/documents'),api('/economics?months=6')]);
 S.econ=econ;
 S.flats=flats.map(toFlat);
 S.docs=docs;
 S.versions=versions.map(v=>({id:v.id,flat:v.flat_id,name:v.name,action:v.action,old:v.old,new:v.new,
  when:new Date(v.created_at).toLocaleString('cs-CZ',{dateStyle:'short',timeStyle:'short'}),
  flatName:(flat(v.flat_id)||{}).addr||''}));
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000)}
function modal(h){$('#sheet').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}

// ---------- navigace ----------
function go(t){V.tab=t;V.flat=null;render();window.scrollTo(0,0)}
function openFlat(id){const f=flat(id);V.tab='flat';V.flat=id;V.year=f?(years(f)[0]||null):null;render();window.scrollTo(0,0)}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===V.tab||(V.tab==='flat'&&b.dataset.t==='flats')));
 const m=$('#main');
 m.innerHTML=V.tab==='home'?home():V.tab==='flats'?flatsList():V.tab==='econ'?econHome():V.tab==='docs'?docsTab():V.tab==='flat'?flatDetail():V.tab==='bench'?benchTab():V.tab==='value'?valueTab():V.tab==='mail'?mailTab():historyTab();
}

// ---------- přehled ----------
function notesFor(){
 const out=[];
 S.flats.forEach(f=>{
  const y=years(f)[0];
  if(y&&bal(f.years[y])<0)out.push({t:`${f.addr}: nedoplatek ${y}, ${kc(-bal(f.years[y]))}`,k:'bad',id:f.id});
  const l=f.leases[f.leases.length-1];
  if(l&&l.to&&new Date(l.to)<TODAY)out.push({t:`${f.addr}: smlouva skončila ${fd(l.to)}. Ověřte, zda nájem pokračuje.`,k:'warn',id:f.id});
 });
 return out;
}
function home(){
 const debts=S.flats.map(f=>{const y=years(f)[0];return y?{f,y,b:bal(f.years[y])}:null}).filter(x=>x&&x.b<0);
 const notes=notesFor();
 return `<h1>Přehled</h1><p class="mut small">Stav k ${fd(TODAY)}</p>
 ${portWidget()}
 <div class="kpis">
  <div class="card"><div class="mut small">Bytů</div><div class="big">${S.flats.length}</div></div>
  <div class="card"><div class="mut small">S nedoplatkem</div><div class="big bad">${debts.length}</div></div>
 </div>
 <h2>K řešení</h2>
 ${debts.map(d=>`<div class="card item" onclick="openFlat(${d.f.id})"><div class="row"><div><b>${esc(d.f.addr)}</b><div class="mut small">${esc(d.f.tenant.name)} · vyúčtování ${d.y}</div></div><span class="tag bad">${kc(-d.b)}</span></div></div>`).join('')||'<div class="card mut">Nic nečeká na řešení.</div>'}
 <h2>Oznámení</h2>
 ${notes.map(n=>`<div class="card item row" onclick="openFlat(${n.id})"><span>${esc(n.t)}</span><span class="tag ${n.k}">${n.k==='bad'?'Pozor':'Ověřit'}</span></div>`).join('')||'<div class="card mut">Žádná oznámení.</div>'}
 ${newsBlock()}
 <h2>Záloha dat</h2>
 <div class="card">
  <p class="small mut" style="margin:0 0 10px">Data jsou uložena na serveru. Kopii můžete stáhnout do souboru.</p>
  <div class="btns" style="margin:0"><button class="btn sec sm" onclick="exportBackup()">Stáhnout zálohu</button></div>
 </div>
 <div class="btns"><button class="btn" onclick="flatForm()">+ Přidat byt</button></div>`;
}

// ---------- byty ----------
function flatsList(){
 return `<div class="row"><h1>Byty</h1><button class="btn" onclick="flatForm()">+ Přidat byt</button></div>`+
 (S.flats.map(f=>{const y=years(f)[0];const b=y?bal(f.years[y]):0;
  return `<div class="card item" onclick="openFlat(${f.id})"><div class="row"><div><b>${esc(f.addr)}</b> <span class="mut">${esc(f.dispo)}</span><div class="mut small">${esc(f.tenant.name)}</div></div>
  <div style="text-align:right">${y?`<b class="${b<0?'bad':'ok'}">${b<0?'−':'+'}${kc(Math.abs(b))}</b>`:'<span class="mut">—</span>'}<div class="mut small">${y?'vyúčtování '+y:'bez dat'}</div></div></div></div>`}).join('')||'<div class="card mut">Zatím žádné byty.</div>');
}

function flatDetail(){
 const f=flat(V.flat);if(!f){go('flats');return ''}
 const l=f.leases[f.leases.length-1];
 const expired=l&&l.to&&new Date(l.to)<TODAY;
 const advTotal=l?Object.values(l.adv).reduce((a,b)=>a+(+b||0),0):0;
 const svjTotal=f.svj.reduce((a,c)=>a+(+c.amount||0),0);
 const incomeM=l?(+l.rent||0)+advTotal:0;
 const net=incomeM-svjTotal;
 const daysTo=l&&l.to?Math.ceil((new Date(l.to)-TODAY)/86400000):null;
 const ly=years(f)[0];
 const lyBal=ly?bal(f.years[ly]):null;
 const lastSt=ly?`${ly}: ${lyBal<0?'nedoplatek ':'přeplatek '}${kc(Math.abs(lyBal))}`:'zatím žádné';
 const svjCard=`<h2>Co platím SVJ (měsíčně)</h2><div class="card">
  ${f.svj.map(c=>`<div class="line"><span>${esc(c.name)}</span><span>${kc(c.amount)} <button class="link small" onclick="delCost(${f.id},${c.id})">smazat</button></span></div>`).join('')||'<div class="mut small">Zatím nic. Přidejte zálohy, které platíte SVJ, a spočítá se čistý příjem.</div>'}
  <div class="line sum"><span>Celkem měsíčně</span><span>${kc(svjTotal)}</span></div>
  <div class="btns"><button class="btn sec sm" onclick="costForm(${f.id})">+ Přidat položku</button></div></div>`;
 const y=V.year?f.years[V.year]:null;
 return `<button class="link" onclick="go('flats')">← Byty</button>
 <h1>${esc(f.addr)} <button class="link small" style="font-size:15px;font-weight:600" onclick="flatForm(${f.id})" title="Upravit název a údaje bytu">✎ upravit</button></h1><p class="mut small">${esc(f.dispo)} · ${esc(f.floor)} · ${esc(f.zip)}</p>
 <div class="card">
  <div class="row"><div><b>${esc(f.tenant.name)}</b><div class="mut small">${f.tenant.others.length?'Další osoba v bytě: '+esc(f.tenant.others.join(', ')):''}</div></div>
  ${l?`<span class="tag ${expired?'warn':'ok'}">${expired?'Smlouva skončila '+fd(l.to):(l.to?'Platná do '+fd(l.to):'Bez konce')}</span>`:'<span class="tag warn">Bez předpisu</span>'}</div>
  ${l?`<div class="mini">
   <div><span>Nájem bez záloh</span><b>${kc(l.rent)}</b></div>
   <div><span>Zálohy od nájemníka</span><b>${kc(advTotal)}</b></div>
   <div><span>Příjem od nájemníka měsíčně</span><b>${kc(incomeM)}</b></div>
   <div><span>Platím SVJ měsíčně</span><b>${kc(svjTotal)}</b></div>
   <div><span>Čistý měsíční příjem</span><b class="${net<0?'bad':'ok'}">${kc(net)}</b></div>
   <div><span>Smlouva</span><b>${l.to?(daysTo>=0?'do '+fd(l.to)+' (za '+daysTo+' dní)':'skončila '+fd(l.to)):'bez konce'}</b></div>
   <div><span>Poslední vyúčtování</span><b>${lastSt}</b></div>
   <div><span>Kauce</span><b>${kc(l.kauce)}</b></div>
   <div><span>Účet nájemce</span><b>${esc(f.bank.acc)||'—'}</b></div>
  </div>`:''}
  <div class="btns"><button class="btn sec sm" onclick="flatForm(${f.id})">Upravit údaje</button><button class="btn sec sm" onclick="leaseForm(${f.id})">Nový předpis</button><button class="btn sec sm" onclick="setVs(${f.id})">Variabilní symbol</button><button class="btn sec sm" onclick="mergeForm(${f.id})">Sloučit s jiným bytem</button></div>

function yearCard(f,yr,y){
 const c=costs(y.items),p=paid(y.items),b=p-c;
 const lease=f.leases.find(l=>l.from&&new Date(l.from).getFullYear()<=yr&&(!l.to||new Date(l.to).getFullYear()>=yr));
 const pred=lease?`<div class="card"><h3>Předpis ${yr}</h3>
  ${Object.entries(lease.adv).map(([k,v])=>`<div class="line"><span>${esc(k)}</span><span>${kc(v)}</span></div>`).join('')}
  <div class="line sum"><span>Zálohy celkem</span><span>${kc(Object.values(lease.adv).reduce((a,x)=>a+(+x||0),0))}</span></div>
  <div class="line"><span>Nájem bez záloh</span><span>${kc(lease.rent)}</span></div></div>`:'';
 const rows=y.items.map(([n,cost,pd])=>{const d=pd-cost;return `<tr><td>${esc(n)}</td><td class="r">${kc(cost)}</td><td class="r">${kc(pd)}</td><td class="r ${d<0?'bad':'ok'}">${d>=0?'+':''}${kc(d)}</td></tr>`}).join('');
 return `${pred}<div class="card">
  <div class="row"><h3>Vyúčtování ${yr}</h3><span class="mut small">${esc(y.doc)}</span></div>
  <table><thead><tr><th>Služba</th><th class="r">Náklad</th><th class="r">Zaplaceno</th><th class="r">Rozdíl</th></tr></thead>
  <tbody>${rows}</tbody>
  <tfoot><tr><td><b>Celkem</b></td><td class="r"><b>${kc(c)}</b></td><td class="r"><b>${kc(p)}</b></td><td class="r"><b class="${b<0?'bad':'ok'}">${b>=0?'+':''}${kc(b)}</b></td></tr></tfoot></table>
  <div class="final ${b<0?'bad':'ok'}"><span>${b<0?'Nedoplatek':'Přeplatek'}</span><b>${kc(Math.abs(b))}</b></div>
 </div>`;
}

const MONTHS=['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
const monthLabel=p=>{const [y,mm]=p.split('-');return MONTHS[+mm-1]+' '+y};
const STAT={paid:'Zaplaceno',partial:'Částečně',unpaid:'Nezaplaceno',extra:'Bez smlouvy'};
function econHome(){
 const e=S.econ;if(!e)return '';
 const ms=e.months,cur=ms[ms.length-1].period;
 const head=ms.map(x=>`<th class="r">${monthLabel(x.period)}</th>`).join('');
 const line=(label,fn,cls='')=>`<tr><td>${label}</td>${ms.map(x=>`<td class="r ${cls}">${fn(x)}</td>`).join('')}</tr>`;
 const missingOf=x=>x.rows.filter(r=>r.status==='unpaid'||r.status==='partial');
 const debts=ms.filter(x=>x.period!==cur).map(x=>{
  const rs=missingOf(x);if(!rs.length)return '';
  return `<div class="card"><h3>${monthLabel(x.period)}</h3>${rs.map(r=>`<div class="resRow"><div><b>${esc(r.tenant||r.addr)}</b><div class="small mut">${esc(r.addr)} · ${STAT[r.status]}: chybí ${kc(r.missing)}</div></div><button class="btn sm" onclick="reminderDraft(${r.flat_id},'${x.period}',${r.missing})">Připravit upomínku</button></div>`).join('')}</div>`;
 }).join('');
 const unm=e.unmatched.length?e.unmatched.map(t=>`<div class="card"><div class="row"><div><b>${kc(t.amount)}</b> · ${fd(t.date)}<div class="small mut">${esc(t.counterparty||'neznámý plátce')}${t.vs?' · VS '+esc(t.vs):''}${t.note?' · '+esc(t.note):''}</div></div></div>
  <div class="grid2"><div><label>Byt</label><select id="ut${t.id}">${flatOpts(null)}</select></div><div style="align-self:end"><button class="btn sm" onclick="assignTx(${t.id})">Přiřadit</button></div></div></div>`).join(''):'<div class="card mut">Všechny platby z výpisů jsou přiřazené.</div>';
 return `<div class="row"><h1>Ekonomika</h1>
  <label style="margin:0;cursor:pointer"><span class="btn sec sm">+ Nahrát výpis (CSV / PDF)</span><input type="file" accept=".csv,.pdf,text/csv,application/pdf" style="display:none" onchange="uploadBank(this)"></label></div>
 <div id="bk" class="small mut"></div>
 <p class="mut small">Očekáváno = předpisy (nájem + zálohy) podle smluv. Přišlo = platby z výpisů přiřazené k bytům.</p>
 <div class="card" style="overflow-x:auto"><table><thead><tr><th></th>${head}</tr></thead><tbody>
  ${line('Očekáváno',x=>kc(x.expected))}
  ${line('Přišlo',x=>kc(x.received))}
  ${line('Rozdíl',x=>(x.received-x.expected>=0?'+':'')+kc(x.received-x.expected),x=>'')}
  ${line('Nezaplaceno bytů',x=>missingOf(x).length)}
  ${line('Nepřiřazeno z výpisu',x=>kc(x.unmatched))}
 </tbody></table></div>
 <h2>Kdo za který měsíc nezaplatil</h2>${debts||'<div class="card mut">Za předchozí měsíce nic nechybí.</div>'}
 <h2>Platby z výpisu k přiřazení</h2>${unm}`;
}
async function uploadBank(input){
 const f=input.files[0];input.value='';if(!f)return;
 const box=$('#bk');box.textContent='Čtu výpis…';
 const fd=new FormData();fd.append('file',f);
 try{
  const r=await fetch('/bank/import',{method:'POST',body:fd});
  if(!r.ok){let d='Chyba '+r.status;try{d=(await r.json()).detail||d}catch(e){}throw new Error(d)}
  const j=await r.json();toast(`Přidáno plateb: ${j.added}, už byly: ${j.skipped}`);
  await reload();render();
 }catch(e){toast(e.message);box.textContent=''}
}

// Telefon do mezinárodního tvaru pro WhatsApp a tel: (9místné české číslo dostane předvolbu 420)
function phoneIntl(p){
 let d=(p||'').replace(/\D/g,'');
 if(d.length===9)d='420'+d;
 return d;
}

 const ph=phoneIntl(f.tenant.phone), mail=f.tenant.email;
 const addr=[f.addr,f.zip].filter(Boolean).join(', ');
 const st='style="text-decoration:none;display:inline-block"';
 const b=[];
 if(ph)b.push(`<a class="btn sec sm" ${st} href="tel:+${ph}">Zavolat</a>`,
              `<a class="btn sec sm" ${st} href="https://wa.me/${ph}" target="_blank" rel="noopener">WhatsApp</a>`);
 if(mail)b.push(`<a class="btn sec sm" ${st} href="mailto:${esc(mail)}?subject=${encodeURIComponent('Byt '+f.addr)}">Napsat e-mail</a>`);

}

async function readDoc(fid){
 const f=flat(fid),y=+$('#uy').value,mode=$('#um').value;
 const base=f.years[y]?f.years[y].items:null;
 if(!base){$('#res').innerHTML=`<div class="card mut" style="margin-top:12px">Pro rok ${y} zatím nejsou uložená data. Vyúčtování tohoto roku se zatím nedá porovnat.</div>`;return}
 const items=base.map(r=>[r[0],+r[1],+r[2]]);
 if(mode==='changed'){const i=items.findIndex(r=>r[0]==='Správa domu');if(i>=0)items[i][1]+=26.92}
 const body={items:items.map(([n,c,p])=>({name:n,cost:String(Math.round(c*100)/100),paid:String(Math.round(p*100)/100)}))};
 try{
  const cmp=await api(`/flats/${fid}/statements/${y}/compare`,'POST',body);
  const diffs=cmp.diffs.filter(d=>d.status==='changed');
  pending={fid,y,items:body.items,diffs,decisions:{}};
  if(!diffs.length){$('#res').innerHTML=`<div class="card ok" style="margin-top:12px">Dokument se shoduje s uloženými údaji. Nic se nemění.</div>`;return}
  renderDiffs();
 }catch(e){toast(e.message)}
}
function renderDiffs(){
 const p=pending;
 $('#res').innerHTML=`<div class="card" style="margin-top:12px;border-color:var(--warn)">
  <h3 class="warn">Našel jsem ${p.diffs.length} rozdíl(y) oproti vyúčtování ${p.y}</h3>
  <p class="small mut">Starší hodnota se uloží do historie a dá se vrátit.</p>
  ${p.diffs.map((d,i)=>{const dec=p.decisions[d.name];return `<div class="resRow"><div><b>${esc(d.name)}</b><div class="small mut">Uloženo ${kc(d.stored.cost)} → v dokumentu ${kc(d.extracted.cost)}</div></div>
   <div class="btns" style="margin:0"><button class="btn sm ${dec==='replace'?'':'sec'}" onclick="decide(${i},'replace')">Nahradit novým</button><button class="btn sm ${dec==='keep'?'':'sec'}" onclick="decide(${i},'keep')">Ponechat starý</button></div></div>`}).join('')}
  <div class="btns"><button class="btn sec sm" onclick="decideAll('keep')">Ponechat všechny</button><button class="btn sm sec" onclick="decideAll('replace')">Nahradit všechny</button></div>
  <div class="btns"><button class="btn" onclick="applyDecisions()">Uložit rozhodnutí</button></div>
 </div>`;
}
function decide(i,c){pending.decisions[pending.diffs[i].name]=c;renderDiffs()}
function decideAll(c){pending.diffs.forEach(d=>pending.decisions[d.name]=c);renderDiffs()}
async function applyDecisions(){
 const p=pending;
 if(p.diffs.some(d=>!p.decisions[d.name])){toast('Nejdřív rozhodněte u všech rozdílů');return}
 try{
  await api(`/flats/${p.fid}/statements/${p.y}/resolve`,'POST',{doc_label:'Nahráno ručně',items:p.items,decisions:p.decisions});
  closeModal();toast('Uloženo, starší hodnoty jsou v historii');
  await reload();render();
 }catch(e){toast(e.message)}
}

 return `<div class="row" style="margin-top:26px"><h2 style="margin:0">Tržní přehled</h2><button class="btn sm sec" id="newsAll" onclick="refreshNews()" ${NEWS_REF.running?'disabled':''}>↻ Aktualizovat</button></div>
 <div id="newsStatus" class="bstat">${newsLine()}</div>
 ${NEWS.week?`<p class="mut small" style="margin:0 0 10px">Týden od ${dmy(NEWS.week)}</p>`:''}
 ${items||'<div class="card mut small">Zatím žádný přehled. Stahuje se každé pondělí ráno, nebo ho spusťte tlačítkem.</div>'}
 <p class="mut small">Zprávy jsou z veřejných zdrojů. Nejsou to právní ani daňové rady, před jednáním ověřte u zdroje.</p>`;
}
async function refreshNews(){
 if(NEWS_REF.running) return;
 NEWS_REF={running:true}; updNews();
 try{ NEWS_REF=await api('/news/refresh','POST') }
 catch(e){ NEWS_REF={running:false,error:e.message}; updNews(); toast(e.message); return }
 updNews(); pollNews();
}
async function pollNews(){
 try{
  const s=await api('/news/refresh'); NEWS_REF=s; updNews();
  if(s.running){ setTimeout(pollNews,4000); return }
 }catch(e){ NEWS_REF={running:false,error:e.message}; updNews(); return }
 try{ NEWS=null; await loadNews() }catch(e){}
 if(V.tab==='home') render(); else updNews();
 if(NEWS_REF.error) toast(NEWS_REF.error); else toast('Tržní přehled je aktualizovaný');

// Hledání nájmů i prodejů u všech bytů najednou (běží na serveru, stránka jen ukazuje stav)
let REF={running:false};
const spinHtml=()=>`<span class="cspin" aria-hidden="true">${[...Array(10)].map((_,k)=>`<i style="transform:rotate(${k*36}deg) translateY(-8px);opacity:${((k+1)/10).toFixed(2)}"></i>`).join('')}</span>`;
function refreshText(s){
 if(s.running) return `Hledám nájmy i prodeje u všech bytů${s.step?` · ${s.step}`:''}${s.total?` (${s.done} z ${s.total})`:''}`;
 if(s.error) return 'Hledání selhalo: '+s.error;
 if(s.result) return `Hotovo: prohledáno ${s.result.searched}, nových nabídek ${s.result.new}${s.result.errors?`, chyb ${s.result.errors}`:''}.`;
 return '';
}
function refreshLine(){
 if(REF.running) return `${spinHtml()}<span>${esc(refreshText(REF))}</span>`;
 const t=refreshText(REF);
 return t?`<span class="mut small">${esc(t)}</span>`:'';
}
function updateRefreshUI(){
 const el=$('#benchStatus'); if(el) el.innerHTML=refreshLine();
 const b=$('#benchAll'); if(b) b.disabled=REF.running;
}
async function refreshAllBench(){
 if(REF.running) return;
 REF={running:true,step:'začínám',done:0,total:0};
 updateRefreshUI();
 try{ REF=await api('/benchmark/refresh','POST') }
 catch(e){ REF={running:false,error:e.message}; updateRefreshUI(); toast(e.message); return }
 updateRefreshUI();
 pollRefresh();
}
async function pollRefresh(){
 try{
  const s=await api('/benchmark/refresh');
  REF=s; updateRefreshUI();
  if(s.running){ setTimeout(pollRefresh,4000); return }
 }catch(e){ REF={running:false,error:e.message}; updateRefreshUI(); return }
 // Hotovo: načíst nové nabídky a odhady, pokud je zrovna otevřená záložka Benchmark
 BENCH=null;
 try{ await loadBench() }catch(e){}
 if(V.tab==='bench') render();
 else updateRefreshUI();
 toast(refreshText(REF));
}
async function searchBench(fid,kind='rent'){

 try{const r=await api(`/flats/${fid}/benchmark/search?kind=${kind}`,'POST');toast(r.found?`Nalezeno ${r.found}, nových ${r.new}`:(r.note||'Nic nenalezeno'));BENCH=null;await loadBench();render()}
 catch(e){toast(e.message)}
 finally{progress('')}
}

// Skupiny dokumentů: pořadí tady je i pořadí na obrazovce
const DOC_GROUPS=[
 ['Smlouvy a dodatky',['smlouva','dodatek','kupni_smlouva'],true],
 ['Vyúčtování',['vyuctovani_svj','vyuctovani_spravy','vyuctovani_najemnikovi'],true],
 ['Faktury a pojistky',['faktura','pojistka'],true],
 ['Doklady a katastr',['vypis_katastru','doklad_najemnika'],true],
 ['Fotky stavu bytu',['fotky_stavu'],false],
 ['Ostatní',['jine'],true]
];
function docGroups(list,emptyText){
 if(!list.length)return `<div class="card mut">${emptyText}</div>`;
 const known=new Set(DOC_GROUPS.flatMap(g=>g[1]));
 let h='';
 for(const [title,types,open] of DOC_GROUPS){
  const items=list.filter(d=>types.includes(d.doc_type)||(title==='Ostatní'&&!known.has(d.doc_type)));
  if(!items.length)continue;
  h+=`<details class="docGroup"${open?' open':''}><summary><b>${title}</b> <span class="mut small">(${items.length})</span></summary>${items.map(docRow).join('')}</details>`;
 }
 return h;
}
function docsTab(){
 const inbox=S.docs.filter(d=>d.status!=='zarazeno');
 const filed=S.docs.filter(d=>d.status==='zarazeno');
 return `<div class="row"><h1>Dokumenty</h1><div class="btns" style="margin:0"><button class="btn sm sec" onclick="rereadAll()">↻ Přečíst znovu</button><button class="btn sm sec" onclick="flatForm()">+ Nový byt</button></div></div>
 <p class="mut small">Nahrajte fotky nebo PDF, co nejvíc najednou. Aplikace pozná typ dokumentu a byt. Pokud si nebude jistá, zeptá se.</p>
 <div class="card" style="text-align:center;padding:26px">
  <div style="display:flex;gap:22px;justify-content:center;flex-wrap:wrap">
  <label style="margin:0;color:var(--ink);font-size:16px;cursor:pointer"><b>+ Nahrát fotky nebo PDF</b>
  <input type="file" multiple accept="image/*,application/pdf" style="display:none" onchange="uploadDocs(this)"></label>
  <label style="margin:0;color:var(--ink);font-size:16px;cursor:pointer"><b>+ Celá složka</b>
  <input type="file" multiple webkitdirectory style="display:none" onchange="uploadDocs(this)"></label>
  </div>
  <div id="up" class="small mut" style="margin-top:8px"></div>
 </div>
 <h2>Ke kontrole (${inbox.length})</h2>${inbox.map(inboxCard).join('')||'<div class="card mut">Nic nečeká.</div>'}
 <h2>Zařazeno</h2>${docGroups(filed,'Zatím nic.')}`;
}
// Velké fotky zmenšíme, ať se rychleji nahrají a levněji přečtou
async function shrink(file){
 if(!file.type.startsWith('image/'))return file;
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
 const k=Math.min(1,2000/Math.max(img.width,img.height));
 const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
 return new File([blob],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'});
}
// Průběh nahrávání: plovoucí lišta dole, vidět na každé obrazovce (prázdný text ji skryje)
function progress(t){
 let b=$('#upBar');
 if(!t){if(b)b.remove();return}
 if(!b){b=document.createElement('div');b.id='upBar';
  b.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92vw;background:#2f5d50;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  document.body.appendChild(b)}
 b.textContent=t;
}
async function uploadDocs(input,flatId){
 const all=[...input.files];
 input.value='';
 return uploadFiles(all,flatId);
}
// Společné nahrávání pro tlačítka, přetažení i Ctrl+V. flatId vyplněné = dokumenty rovnou patří k bytu
async function uploadFiles(all,flatId){
 const files=all.filter(f=>/^(image\/(jpeg|png|gif|webp)|application\/pdf)$/.test(f.type)||/\.(pdf|jpe?g|png|webp|gif)$/i.test(f.name));
 const skipped=all.length-files.length;
 if(!files.length){toast('Žádný podporovaný soubor (PDF nebo obrázek)');return}
 let ok=0,fail=0;
 // posíláme po jednom souboru, ať je vidět průběh a jeden pomalý soubor nic nezastaví
 for(let i=0;i<files.length;i++){
  progress(`Nahrávám a čtu ${i+1} z ${files.length}: ${files[i].name}`);
  try{
   const fd=new FormData();
   fd.append('files',await shrink(files[i]).catch(()=>files[i]));
   if(flatId)fd.append('flat_id',flatId);
   const res=await fetch('/documents',{method:'POST',body:fd});
   if(!res.ok){let d='Chyba '+res.status;try{d=(await res.json()).detail||d}catch(e){}throw new Error(d)}
   ok++;
  }catch(e){fail++;toast(files[i].name+': '+e.message)}
 }
 progress('');
 toast(`Nahráno ${ok}${fail?', chyb '+fail:''}${skipped?', přeskočeno '+skipped:''}`);
 await reload();render();
}
// Přetažení a Ctrl+V: na kartě bytu se dokument zařadí k tomuto bytu, v Dokumentech bez přiřazení
function dropTarget(){
 if(V.tab==='flat'&&V.flat)return {flatId:V.flat};
 if(V.tab==='docs')return {flatId:null};
 return null;
}
function dropHint(on,text){
 let h=$('#dropHint');
 if(!on){if(h)h.remove();return}
 if(!h){h=document.createElement('div');h.id='dropHint';
  h.style.cssText='position:fixed;inset:12px;border:3px dashed #2f5d50;border-radius:16px;background:rgba(47,93,80,.10);z-index:98;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#2f5d50;pointer-events:none';
  document.body.appendChild(h)}
 h.textContent=text;
}
const hasFiles=e=>!!(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'));
let dragDepth=0;
window.addEventListener('dragenter',e=>{
 if(!hasFiles(e))return;
 e.preventDefault();dragDepth++;
 dropHint(true,dropTarget()?'Pusťte soubory sem':'Nejdřív otevřete byt nebo Dokumenty');
});
window.addEventListener('dragover',e=>{
 if(!hasFiles(e))return;
 e.preventDefault();e.dataTransfer.dropEffect=dropTarget()?'copy':'none';
});
window.addEventListener('dragleave',e=>{
 if(!hasFiles(e))return;
 dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)dropHint(false);
});
window.addEventListener('drop',e=>{
 if(!hasFiles(e))return;
 e.preventDefault();dragDepth=0;dropHint(false);
 const t=dropTarget();
 if(!t){toast('Nejdřív otevřete byt nebo Dokumenty');return}
 uploadFiles([...e.dataTransfer.files],t.flatId);
});
window.addEventListener('paste',e=>{
 const files=[...((e.clipboardData&&e.clipboardData.files)||[])];
 if(!files.length)return; // obyčejný text necháme být
 const t=dropTarget();
 if(!t){toast('Nejdřív otevřete byt nebo Dokumenty');return}
 e.preventDefault();
 uploadFiles(files,t.flatId);
});

// Přečte znovu všechny dokumenty: doplní nová pole (dispozice, PSČ, kontakty, účet) a přepočítá přiřazení
async function rereadAll(){
 const ids=S.docs.map(d=>d.id);
 if(!ids.length){toast('Zatím nejsou žádné dokumenty');return}
 if(!confirm(`Přečíst znovu ${ids.length} dokumentů? Typ a údaje se přepočítají, ruční přiřazení k bytu zůstane.`))return;
 let ok=0,fail=0;
 for(let i=0;i<ids.length;i++){
  progress(`Čtu znovu ${i+1} z ${ids.length}`);
  try{await api(`/documents/${ids[i]}/classify`,'POST');ok++}catch(e){fail++;toast(e.message)}
 }
 progress('');
 toast(`Přečteno ${ok}${fail?', chyb '+fail:''}`);
 await reload();render();
}

let BUILD=null;

  location.reload();
 }catch(e){toast(e.message)}
}
fetchBuild().then(v=>{BUILD=v}).catch(()=>{});

// ---------- režim zobrazení ----------
function currentTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function updateThemeBtn(){const b=$('#themeBtn');if(b)b.textContent=currentTheme()==='dark'?'☀ Světlý režim':'☾ Noční režim'}
function toggleTheme(){
 const next=currentTheme()==='dark'?'light':'dark';
 document.documentElement.dataset.theme=next;
 try{localStorage.setItem('sb-theme',next)}catch(e){}
 updateThemeBtn();
}

// ---------- start ----------
(async()=>{
 try{const t=localStorage.getItem('sb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
 updateThemeBtn();
 try{await reload()}catch(e){toast(e.message)}
 render();
})();
</script>
