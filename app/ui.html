<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MG Property</title>
<meta name="theme-color" content="#1F5C4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MG Property">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F5C4A'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' font-weight='700' text-anchor='middle' fill='%23FF6B4A'%3EMG%3C/text%3E%3C/svg%3E">
<style>
:root{--paper:#EEF4F0;--card:#F9FCFA;--ink:#14201B;--mut:#5B6B63;--line:#D5E2DA;--acc:#1F5C4A;--onacc:#ffffff;--ok:#1F5C4A;--okB:#DDF2E6;--warn:#7A5A00;--warnB:#FFF1C9;--bad:#B4441F;--badB:#FFE3DA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0B1512;--card:#162A24;--ink:#EAF4EE;--mut:#9DB3A8;--line:#1E3430;--acc:#6FD3B0;--onacc:#0B1512;--ok:#8EE3C4;--okB:#1F4A3D;--warn:#F5D680;--warnB:#43391A;--bad:#FF9A7E;--badB:#4A2A21}}
:root[data-theme="dark"] nav button:not(.brand){box-shadow:0 8px 22px -8px rgba(124,58,237,.7),0 0 0 1px rgba(124,58,237,.25)}
:root[data-theme="dark"]{--paper:#0B1512;--card:#162A24;--ink:#EAF4EE;--mut:#9DB3A8;--line:#1E3430;--acc:#6FD3B0;--onacc:#0B1512;--ok:#8EE3C4;--okB:#1F4A3D;--warn:#F5D680;--warnB:#43391A;--bad:#FF9A7E;--badB:#4A2A21}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-left:118px}
h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;letter-spacing:-.01em}
h1{font-size:30px;margin:6px 0 4px}
h2{font-size:20px;margin:26px 0 10px}
h3{font-size:17px;margin:0 0 10px}
main{max-width:760px;margin:0 auto;padding:18px 16px}
.mut{color:var(--mut)}.small{font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.item{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.kpis,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px;font-size:14px}
.mini span{display:block;font-size:13px;color:var(--mut)}
.tag{font-size:13px;padding:3px 11px;border-radius:99px;white-space:nowrap;display:inline-block}
.tag.ok{background:var(--okB);color:var(--ok)}.tag.warn{background:var(--warnB);color:var(--warn)}.tag.bad{background:var(--badB);color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.link{background:none;border:0;color:var(--acc);font:inherit;padding:0;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mut);font-weight:500}
.r{text-align:right}
tfoot td{border-bottom:0;padding-top:12px}
.final{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:14px;border-radius:12px;font-size:17px}
.final.bad{background:var(--badB)}.final.ok{background:var(--okB)}
.final b{font-size:24px}
.line{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line.sum{font-weight:700;border-bottom:0}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
input,select,textarea{font:inherit;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:4px}
.modal{position:fixed;inset:0;background:rgba(20,30,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet.wide{max-width:min(1500px,97vw);max-height:96vh}
.docViewer{height:68vh}
.sheet.wide .docViewer{height:calc(96vh - 190px)}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.doc{white-space:pre-wrap;font:14px/1.6 Georgia,"Times New Roman",serif;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.resRow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
nav{position:fixed;left:0;top:0;bottom:0;width:118px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:14px 10px;z-index:5}
nav button.brand{background:none;border:0;padding:4px 4px 10px;margin:0 0 4px;text-align:left;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;color:var(--acc);font-size:16px;line-height:1.2;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer}
nav button.brand:hover{color:var(--ink)}
nav button{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 10px;color:var(--ink);font:inherit;font-size:15px;text-align:left;cursor:pointer;min-width:0;overflow-wrap:anywhere;hyphens:auto;box-shadow:0 8px 20px -10px rgba(76,29,149,.55),0 0 0 1px rgba(124,58,237,.10);transition:box-shadow .2s,transform .2s}
nav button:not(.brand):hover{transform:translateY(-1px);box-shadow:0 12px 26px -10px rgba(91,33,182,.7),0 0 0 1px rgba(124,58,237,.22)}
nav button.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600;box-shadow:0 10px 24px -8px rgba(109,40,217,.85),0 0 18px -4px rgba(139,92,246,.55)}
nav button.theme{margin-top:auto;font-size:13px;color:var(--mut)}
@media (max-width:560px){
 body{padding-left:96px}
 nav{width:96px;padding:10px 6px;gap:8px}
 nav button.brand{font-size:13px;text-align:center;padding:4px 2px 10px}
 nav button:not(.brand){font-size:12px;line-height:1.2;padding:11px 4px;text-align:center;letter-spacing:-.01em}
 main{padding:14px 12px}
}
.toast{position:fixed;left:calc(50% + 59px);transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--mut);margin-top:14px}
.warnTxt{color:var(--warn)}
/* Kolečko složené z čárek při hledání u všech bytů */
.cspin{position:relative;display:inline-block;width:18px;height:18px;vertical-align:middle;margin-right:10px;animation:cspin 1s linear infinite;flex:0 0 auto}
.cspin i{position:absolute;left:50%;top:50%;width:2.5px;height:6px;margin:-3px 0 0 -1.25px;border-radius:2px;background:var(--acc)}
@keyframes cspin{to{transform:rotate(360deg)}}
.bstat{display:flex;align-items:center;min-height:22px;margin:4px 0 14px;font-size:14px}
@media (prefers-reduced-motion:reduce){.cspin{animation-duration:2.5s}}
/* Seznam bytů: jen dlaždice s názvem */
.flatGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:8px}
@media (max-width:820px){.flatGrid{grid-template-columns:repeat(2,1fr)}}
.ematrix{display:grid;gap:8px;overflow-x:auto;padding-bottom:4px}
.ehead{font-size:12px;color:var(--mut);text-align:center;align-self:end;padding-bottom:2px}
.etile{position:relative;border-radius:14px;padding:12px 12px 12px 18px;background:var(--card);border:1px solid rgba(34,197,94,.55);box-shadow:0 0 22px -8px rgba(34,197,94,.7);display:flex;flex-direction:column;justify-content:center;min-width:0}
.etile:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--fc)}
.etile b{font-size:15px;overflow-wrap:anywhere}
.etile span{font-size:12px;color:var(--mut)}
.ecell{border-radius:12px;padding:9px 10px;text-align:right;border:1px solid var(--line);background:rgba(255,255,255,.02);display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums;min-height:58px}
.ecell b{font-size:15px;color:var(--mut);font-weight:600}
.ecell span{font-size:11px;color:var(--mut)}
.ecell.paid{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.6)}
.ecell.paid b{color:#22C55E}
.ecell.partial{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.55)}
.ecell.partial b{color:#F59E0B}
.ecell.extra{background:rgba(139,124,255,.16);border-color:rgba(139,124,255,.6)}
.ecell.extra b{color:#A78BFA}
.ecell.empty{color:var(--mut);text-align:center;opacity:.5;align-items:center}
.flatTile{position:relative;overflow:hidden;text-align:left;min-height:138px;padding:18px 16px;border-color:var(--fc);box-shadow:0 0 0 1px var(--fc),0 0 26px -8px var(--fc)}
.ftMark{position:absolute;right:-8px;bottom:-30px;font-size:110px;font-weight:900;color:var(--fc);opacity:.13;line-height:1;pointer-events:none;letter-spacing:-.04em}
.ftName{display:block;font-size:17px;font-weight:700;position:relative;overflow-wrap:anywhere}
.flatTile small{display:block;margin-top:6px;color:var(--mut);position:relative}
body::before{content:"MG";position:fixed;right:-3vw;bottom:-6vh;font-size:44vw;font-weight:900;letter-spacing:-.05em;line-height:1;color:rgba(139,124,255,.045);pointer-events:none;z-index:0;user-select:none}
main{position:relative;z-index:1}
.flatTile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 12px;min-height:76px;color:var(--ink);font:inherit;font-weight:600;font-size:15px;line-height:1.3;text-align:center;cursor:pointer;overflow-wrap:anywhere;box-shadow:0 8px 20px -12px rgba(76,29,149,.5)}
.flatTile:active{transform:scale(.98)}
/* Záhlaví bytu zůstává nahoře při listování */
.flatBar{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-18px -16px 14px;padding:12px 64px 12px 176px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);box-shadow:0 12px 30px -20px var(--acc)}
.flatBarKicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.flatBarName{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.flatBarMeta{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:560px){.flatBar{padding:10px 12px 10px 110px;flex-wrap:wrap}.flatBarName{font-size:20px}.flatBarMeta{display:none}}
.pend{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
/* Portfolio: fialový panel s podsvícením */
.pwidget{position:relative;margin:4px auto 18px;max-width:440px;text-align:center;padding:18px 18px 16px;border-radius:20px;background:radial-gradient(120% 140% at 50% 0%,#2A1656 0%,#0C0818 62%);border:1px solid #7C3AED;box-shadow:0 0 0 1px rgba(168,85,247,.25),0 0 30px rgba(139,92,246,.45),0 0 70px rgba(139,92,246,.18);color:#E9D5FF;cursor:pointer}
.pwidget .pl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#C4B5FD}
.pwidget .pv{font-size:34px;font-weight:800;color:#F3E8FF;text-shadow:0 0 12px rgba(192,132,252,.9),0 0 26px rgba(139,92,246,.7);font-variant-numeric:tabular-nums;margin:6px 0 4px}
.pwidget .pv.pvl{font-size:44px}
.pwidget .pc{font-size:14px;color:#C4B5FD}
.pwidget.fixed{cursor:default}
/* Sloupcový graf hodnoty bytů */
.vwrap{overflow-x:auto;padding:18px 12px 12px}
.vrow{display:flex;align-items:flex-end;gap:12px;min-height:280px;min-width:100%}
.vcol{flex:1 1 0;min-width:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center}
.vval{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:2px;white-space:nowrap}
.vchg{font-size:11px;margin-bottom:4px;white-space:nowrap}
.vbar{width:100%;max-width:64px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 45%,transparent))}
.vbar.none{background:none;border:2px dashed var(--line);min-height:8px}
.vname{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.25;max-width:96px;word-break:break-word}
.homeHead{display:flex;justify-content:space-between;align-items:flex-end;margin:4px 0 12px}
.statGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat span{display:block;color:var(--mut);font-size:13px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.listCard{padding:4px 16px}
.flatRow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.flatRow:last-child{border-bottom:0}
.docList{padding:4px 16px}
.docItem{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.docItem:last-child{border-bottom:0}
.docItem .t{font-weight:600;line-height:1.35}
.docItem .acts{display:flex;gap:12px;flex-shrink:0;padding-top:2px}

/* ---- nový vzhled: tmavý, podsvícené panely; světlý režim přes přepínač ---- */
:root:not([data-theme="light"]){--paper:#070B1A;--card:rgba(22,28,58,.72);--ink:#E8ECFF;--mut:#8C97C4;--line:rgba(139,124,255,.22);--acc:#8B7CFF;--onacc:#0A0B1F;--ok:#5EEAD4;--okB:rgba(94,234,212,.14);--warn:#FCD34D;--warnB:rgba(252,211,77,.14);--bad:#FB7185;--badB:rgba(251,113,133,.16);--glow:0 0 0 1px rgba(139,124,255,.18),0 14px 40px -16px rgba(139,124,255,.55)}
:root[data-theme="light"]{--paper:#F4F6FC;--card:#FFFFFF;--ink:#171A33;--mut:#5C6494;--line:#DDE2F3;--acc:#5B4BE0;--onacc:#FFFFFF;--ok:#0F766E;--okB:#D7F5EF;--warn:#92400E;--warnB:#FEF3C7;--bad:#B91C1C;--badB:#FEE2E2;--glow:0 6px 24px -14px rgba(91,75,224,.35)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1100px 620px at 8% -12%,rgba(139,124,255,.22),transparent 60%),radial-gradient(900px 520px at 108% 8%,rgba(34,211,238,.13),transparent 60%),var(--paper);min-height:100vh}
h1,h2,h3{font-family:inherit}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600;letter-spacing:-.005em;margin:28px 0 12px;text-transform:none}
.bigHead{font-size:22px;font-weight:800;letter-spacing:.01em;margin:30px 0 10px}
main{max-width:1180px}
.card,.stat,.flatTile,.kpi,.tile{background:var(--card);border:1px solid var(--line);box-shadow:var(--glow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card{border-radius:18px}
.recent{font-size:12px;color:var(--ink);margin:-4px 0 16px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.recentH{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:4px}
.recentRow{display:flex;gap:10px;line-height:1.6;min-width:0}
.recentT{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.recentX{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.txOk{border-color:rgba(34,197,94,.55);box-shadow:0 0 0 1px rgba(34,197,94,.25),0 0 26px -6px rgba(34,197,94,.55)}
.card.txMiss{border-color:rgba(239,68,68,.6);box-shadow:0 0 0 1px rgba(239,68,68,.3),0 0 26px -6px rgba(239,68,68,.6)}
.btn{border-radius:12px;box-shadow:0 8px 24px -10px var(--acc)}
.kpiRow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 6px}
.kpi{border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:auto -30% -60% auto;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,var(--acc),transparent 70%);opacity:.28;pointer-events:none}
.kpi span{font-size:13px;color:var(--mut)}
.kpi b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi small{font-size:12px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{border-radius:16px;padding:14px 16px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:92px;transition:transform .15s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--acc),0 18px 40px -14px var(--acc)}
.tile span{font-size:14px;font-weight:600;line-height:1.25}
.tile b{font-size:22px;font-variant-numeric:tabular-nums}
.tile small{color:var(--mut);font-size:12px}
.chips .chip{border-radius:99px}
nav{background:rgba(12,16,38,.7);backdrop-filter:blur(12px);border-right:1px solid var(--line)}
nav button{border-radius:14px}
select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;margin-top:4px}
.filterBar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 12px}
.filterBar label{margin-top:0}

/* logo v levém horním rohu */
.brandTop{position:fixed;top:12px;left:12px;z-index:7;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(139,124,255,.24),rgba(34,211,238,.10)),var(--card);border-color:rgba(139,124,255,.55)!important;border:1px solid var(--line);border-radius:14px;padding:7px 14px 7px 7px;color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer;box-shadow:var(--glow)}
.brandTop:hover{color:var(--acc)}
.logoMark{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8B7CFF,#22D3EE);color:#0A0B1F;font-weight:800;font-size:12px;letter-spacing:.02em}
nav{padding-top:70px}
.navVal{margin:auto 0;padding:14px 8px;text-align:center;border-radius:16px;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.6);box-shadow:0 0 24px -4px rgba(34,197,94,.75);color:#FDBA74;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.navVal b{display:block;margin-top:4px;font-size:15px;color:#4ADE80;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(74,222,128,.6)}
@media (max-width:560px){ .brandTop{font-size:13px;padding:6px 10px 6px 6px} .brandTop span:last-child{display:none} }

.annualTile{position:absolute;top:14px;right:16px;padding:10px 14px;border-radius:14px;text-align:right;background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.6);box-shadow:0 0 24px -4px rgba(34,197,94,.75);z-index:1}
.annualTile b{display:block;font-size:20px;color:#22C55E;font-variant-numeric:tabular-nums}
.appVer{font-size:11px;color:var(--mut);text-align:center;margin-top:10px;letter-spacing:.04em}

<body>
<main id="main"><p class="mut">Načítám…</p></main>
<button id="verBtn" title="Zkontrolovat novou verzi" onclick="checkForUpdate()" style="position:fixed;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:var(--paper);font:inherit;font-weight:800;font-size:13px;cursor:pointer;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.2)">MG</button>
<button class="brandTop" onclick="go('home')" title="Na hlavní stránku"><span class="logoMark">MG</span><span style="display:flex;flex-direction:column;line-height:1.2"><span>MG Property</span><small style="font-size:11px;font-weight:500;opacity:.75">verze 1.36</small></span></button>
<nav>

<button data-t="home" onclick="go('home')">Přehled</button>
<button data-t="econ" onclick="go('econ')">Ekonomika</button>
<button data-t="value" onclick="go('value')">Portfolio</button>
<button data-t="flats" onclick="go('flats')">Byty</button>
<button data-t="docs" onclick="go('docs')">Upload</button>
<button data-t="bench" onclick="go('bench')">Benchmark</button>
<button data-t="mail" onclick="go('mail')">Upomínky</button>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const kc=n=>Math.round(n||0).toLocaleString('cs-CZ')+' Kč';
// Datum pořízení (z fotky), jinak datum nahrání. U každého dokumentu, ať je vidět, kdy vznikl.
const fdt=iso=>iso?new Date(iso).toLocaleString('cs-CZ',{dateStyle:'short',timeStyle:'short'}):'';
const docWhen=d=>d.taken_at?`pořízeno ${fdt(d.taken_at)}`:`nahráno ${fdt(d.created_at)}`;
const fd=s=>{if(!s)return'—';const d=new Date(s);return isNaN(d)?'—':d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const costs=it=>it.reduce((s,r)=>s+(+r[1]||0),0);
const paid=it=>it.reduce((s,r)=>s+(+r[2]||0),0);
const bal=y=>paid(y.items)-costs(y.items);
const TODAY=new Date();
const years=f=>Object.keys(f.years).map(Number).sort((a,b)=>b-a);
const flat=id=>S.flats.find(f=>f.id==id);

let S={flats:[],versions:[],docs:[],econ:null};
let V={tab:'home',flat:null,year:null};
let pending=null;

// ---------- komunikace se serverem ----------
async function api(path,method='GET',body){
 const opt={method,headers:{}};
 if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
 const r=await fetch(path,opt);
 if(r.status===401)throw new Error('Nejste přihlášen. Obnovte stránku a zadejte jméno a heslo.');
 if(!r.ok){
  let d='Chyba '+r.status;
  try{const j=await r.json();if(typeof j.detail==='string')d=j.detail;else if(j.detail&&j.detail.message)d=j.detail.message;}catch(e){}
  throw new Error(d);
 }
 return r.status===204?null:r.json();
}

// převod z formátu API do tvaru, se kterým pracuje rozhraní
function toFlat(f){
 return {id:f.id,addr:f.addr,dispo:f.dispo||'',floor:f.floor||'',zip:f.zip||'',owner:f.owner||'',
  tenant:{name:f.tenant.name||'',email:f.tenant.email||'',phone:f.tenant.phone||'',others:f.tenant.others||[]},
  bank:{acc:f.bank_acc||''},
  leases:f.leases.map(l=>({id:l.id,from:l.valid_from,to:l.valid_to||'',rent:l.rent,kauce:l.deposit,adv:l.advances||{}})),
  svj:(f.svj_costs||[]).map(c=>({id:c.id,name:c.name,amount:c.amount})),
  svj_all:(f.svj_all||[]).map(c=>({...c})),
  cmp_links:(f.cmp_links||[]).map(k=>({...k})),
  acq:f.acquisition||null,
  area_m2:f.area_m2,
  years:Object.fromEntries(f.statements.map(st=>[st.year,{doc:st.doc_label,items:st.items.map(i=>[i.name,i.cost,i.paid])}]))};
}
async function reload(){
 const [flats,versions,docs,econ]=await Promise.all([api('/flats'),api('/versions'),api('/documents'),api('/economics?months=6')]);
 S.econ=econ;S.ov=null;
 S.flats=flats.map(toFlat);
 S.docs=docs;
 S.versions=versions.map(v=>({id:v.id,flat:v.flat_id,name:v.name,action:v.action,old:v.old,new:v.new,
  when:new Date(v.created_at).toLocaleString('cs-CZ',{dateStyle:'short',timeStyle:'short'}),
  ts:new Date(v.created_at).getTime(),flatName:(flat(v.flat_id)||{}).addr||''}));
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000)}
function modal(h){$('#sheet').classList.remove('wide');$('#sheet').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}

// ---------- navigace ----------
function go(t){V.tab=t;V.flat=null;render();window.scrollTo(0,0)}
function openFlat(id){const f=flat(id);V.tab='flat';V.flat=id;V.year=f?(years(f)[0]||null):null;render();window.scrollTo(0,0)}
function render(){
 if(!PORT&&!PORT_LOADING)loadPortfolio().then(render);
 const nv=$('#navVal'); if(nv)nv.innerHTML=PORT?`<small>Hodnota portfolia</small><b>${kc(PORT.total)}</b>`:'';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===V.tab||(V.tab==='flat'&&b.dataset.t==='flats')));
 const m=$('#main');
 m.innerHTML=(V.tab==='flat'&&V.flat?flatBar(V.flat)+flatTiles(V.flat):'')+(V.tab==='home'?home():V.tab==='flats'?flatsList():V.tab==='econ'?econHome():V.tab==='docs'?docsTab():V.tab==='flat'?flatDetail():V.tab==='bench'?benchTab():V.tab==='value'?valueTab():V.tab==='mail'?mailTab():historyTab());
}

// ---------- přehled ----------
function notesFor(){
 const out=[];
 S.flats.forEach(f=>{
  const y=years(f)[0];
  if(y&&bal(f.years[y])<0)out.push({t:`${f.addr}: nedoplatek ${y}, ${kc(-bal(f.years[y]))}`,k:'bad',id:f.id});
  const l=f.leases[f.leases.length-1];
  if(l&&l.to&&new Date(l.to)<TODAY)out.push({t:`${f.addr}: smlouva skončila ${fd(l.to)}. Ověřte, zda nájem pokračuje.`,k:'warn',id:f.id});
  if(l&&l.to){const dl=Math.ceil((new Date(l.to)-TODAY)/86400000);if(dl>=0&&dl<=60)out.push({t:`${f.addr}: smlouva končí za ${dl} dní (${fd(l.to)}). Připravte prodloužení nebo novou smlouvu.`,k:'warn',id:f.id})}
 });
 return out;
}
function homeStats(){
 let inc=0,svj=0;
 S.flats.forEach(f=>{
  const l=f.leases[f.leases.length-1];
  if(l)inc+=(+l.rent||0)+Object.values(l.adv||{}).reduce((a,b)=>a+(+b||0),0);
  svj+=f.svj.reduce((a,c)=>a+(+c.amount||0),0);
 });
 return {inc,svj,net:inc-svj};
}
// Posledních 5 vlastních akcí: nahrané dokumenty a změny údajů
function recentActivity(){
 const items=[
  ...S.docs.map(d=>({ts:new Date(d.created_at).getTime(),text:`Nahrán dokument ${d.filename}`,where:(flat(d.flat_id)||{}).addr||'bez přiřazení'})),
  ...S.versions.map(v=>({ts:v.ts||0,text:`${v.name} · ${v.action}`,where:v.flatName||''}))
 ].filter(i=>i.ts).sort((a,b)=>b.ts-a.ts).slice(0,5);
 if(!items.length)return '';
 return `<div class="recent"><div class="recentH">Naposledy</div>${items.map(i=>`<div class="recentRow"><span class="recentT">${esc(new Date(i.ts).toLocaleString('cs-CZ',{dateStyle:'short',timeStyle:'short'}))}</span><span class="recentX">${esc(i.text)}${i.where?` <span class="mut">· ${esc(i.where)}</span>`:''}</span></div>`).join('')}</div>`;
}
function home(){
 const y=V.homeYear||TODAY.getFullYear();
 if(!S.ov||S.ov.year!==y){loadOverview(y);return `<div class="mut">Načítám přehled…</div>`}
 const ov=S.ov, ovFlat=Object.fromEntries(ov.flats.map(r=>[r.id,r]));
 const debts=S.flats.map(f=>{const yy=years(f)[0];return yy?{f,y:yy,b:bal(f.years[yy])}:null}).filter(x=>x&&x.b<0);
 const notes=notesFor();
 const chips=ov.years.map(v=>`<button class="chip ${v===y?'on':''}" onclick="setHomeYear(${v})">${v}</button>`).join('');
 const tiles=S.flats.map(f=>{const r=ovFlat[f.id]||{};return `<button class="tile" onclick="openFlat(${f.id})"><span>${esc(f.addr)}</span><small>${esc(f.tenant.name)||'Bez nájemníka'}</small><b class="${(r.profit||0)<0?'bad':'ok'}">${kc(r.profit||0)}</b><small>${r.payments||0} plateb · výdaje ${kc(r.landlord_cost||0)}</small></button>`}).join('');
 return `<div class="homeHead"><div><div class="mut small">Stav k ${fd(TODAY)}</div><h1>Přehled</h1></div><div class="chips" style="margin:0">${chips}</div></div>
 <div class="kpiRow">
  <div class="kpi"><span>Výnosy ${y}</span><b>${kc(ov.income)}</b><small>přijaté platby přiřazené bytům</small></div>
  <div class="kpi"><span>Náklady ${y}</span><b>${kc(ov.expenses)}</b><small>náklady SVJ za rok</small></div>
  <div class="kpi"><span>Zisk ${y}</span><b class="${ov.profit<0?'bad':'ok'}">${kc(ov.profit)}</b><small>příjmy minus výdaje (výdaje z vyúčtování, jinak z měsíčních plateb SVJ)</small></div>
 </div>
 <h2>Byty</h2>
 <div class="tiles">${tiles||'<div class="mut">Zatím žádné byty.</div>'}</div>
 <div class="btns"><button class="btn" onclick="tenantNew()">+ Nový nájemník (doklad)</button><button class="btn sec" onclick="flatForm()">+ Přidat byt</button><button class="btn sec" onclick="exportBackup()">Stáhnout zálohu</button></div>
 ${newsBlock()}
 ${portWidget()}
 ${recentActivity()}
 ${debts.length?`<h2>K řešení</h2>${debts.map(d=>`<div class="card item row" onclick="openFlat(${d.f.id})"><div><b>${esc(d.f.addr)}</b><div class="mut small">${esc(d.f.tenant.name)} · vyúčtování ${d.y}</div></div><span class="tag bad">${kc(-d.b)}</span></div>`).join('')}`:''}
 ${notes.length?`<h2>Oznámení</h2>${notes.map(n=>`<div class="card item row" onclick="openFlat(${n.id})"><span>${esc(n.t)}</span><span class="tag ${n.k}">${n.k==='bad'?'Pozor':'Ověřit'}</span></div>`).join('')}`:''}
 `;
}
let OV_LOADING=null;
function setHomeYear(y){V.homeYear=y;S.ov=null;render()}
function loadOverview(y){
 if(OV_LOADING===y)return;
 OV_LOADING=y;
 api(`/overview?year=${y}`).then(r=>{S.ov=r;OV_LOADING=null;render()}).catch(e=>{
  OV_LOADING=null;S.ov={year:y,years:[y],income:0,expenses:0,profit:0,flats:[]};toast(e.message);render()});
}

// ---------- byty ----------
// Pevná barva každého bytu (podle čísla bytu, nebo ruční volba). Stejná na dlaždici, v Ekonomice i v kartě.
const FLAT_COLORS=[['#EF4444','červená'],['#F97316','oranžová'],['#EAB308','žlutá'],['#22C55E','zelená'],['#06B6D4','tyrkysová'],['#3B82F6','modrá'],['#8B5CF6','fialová'],['#EC4899','růžová']];
function flatColor(f){ return (f&&f.color)||FLAT_COLORS[(((f?.id||1)-1)%8+8)%8][0] }
function flatsList(){
 const tiles=S.flats.map(f=>`<button class="flatTile" style="--fc:${flatColor(f)}" onclick="openFlat(${f.id})"><span class="ftMark">${esc((f.addr||'').trim().slice(0,2).toUpperCase())}</span><span class="ftName">${esc(f.addr)}</span><small>${esc(f.tenant?.name||'Bez nájemníka')}</small></button>`).join('');
 return `<div class="row"><h1>Byty</h1><button class="btn" onclick="flatForm()">+ Přidat byt</button></div>`+
 (tiles?`<div class="flatGrid">${tiles}</div>`:'<div class="card mut">Zatím žádné byty.</div>');
}

// ---------- úprava částek v kartě bytu (nájemník i já) ----------
let EM=null;
function editModal(title,fields,onSave,onDelete){
 fields=[...fields,{id:'eff',label:'Platí od (datum změny; u opravy den začátku předpisu)',type:'date',value:TODAY_ISO()}];
 EM={fields:fields.map(f=>f.id),onSave,onDelete};

// Položky SVJ pro zvolený rok, seskupené podle předpisu (období platnosti). Platné nahoře, ukončené šedě.
function svjRows(f){
 const today=TODAY_ISO(), Y=V.year||TODAY.getFullYear();
 const key=c=>String(c.name||'').replace(/\s+/g,'').toUpperCase();
 const act={};
 (f.svj_all||[]).forEach(c=>{
  if(c.valid_from&&c.valid_from>today)return;
  if(c.valid_to&&c.valid_to<today)return;
  const k=key(c);
  if(!act[k]||String(c.valid_from||'')>=String(act[k].valid_from||''))act[k]=c;
 });
 const cur=Object.values(act).sort((x,y)=>String(x.name).localeCompare(String(y.name),'cs'));
 const curIds=new Set(cur.map(c=>c.id));
 const hist=(f.svj_all||[]).filter(c=>!curIds.has(c.id)&&(c.valid_from||'0000')<=`${Y}-12-31`&&(c.valid_to||'9999')>=`${Y}-01-01`);
 const line=c=>`<div class="line" style="cursor:pointer" onclick="costRowEdit(${f.id},${c.id})"><span>${esc(c.name)}</span><span>${kc(c.amount)}</span></div>`;
 if(!cur.length&&!hist.length)return '<div class="mut small">Zatím nic. Přidejte zálohy, které platíte, nebo načtěte předpis z dokumentu.</div>';
 const total=cur.reduce((t,c)=>t+(+c.amount||0),0);
 let html=cur.length?`<div class="row" style="margin:4px 0 6px"><span class="mut small">Platí se dnes</span><b>${kc(total)} měsíčně</b></div>${cur.map(line).join('')}`:'<div class="mut small">Dnes neplatí žádný předpis.</div>';
 if(hist.length){
  const groups={};
  hist.forEach(c=>{const k=`${c.valid_from||''}|${c.valid_to||''}`;(groups[k]=groups[k]||{from:c.valid_from,to:c.valid_to,items:[]}).items.push(c)});
  const gs=Object.values(groups).sort((x,y)=>String(y.from||'').localeCompare(String(x.from||'')));
  const histHtml=gs.map(g=>`<div style="margin-top:10px"><div class="small mut"><b>Od ${g.from?dmy(g.from):'odjakživa'} do ${g.to?dmy(g.to):'dosud'}</b></div>${g.items.sort((x,y)=>String(x.name).localeCompare(String(y.name),'cs')).map(line).join('')}</div>`).join('');
  html+=`<details class="cmpOld" style="margin-top:12px"><summary>Historie předpisů v roce (${hist.length} položek)</summary>${histHtml}</details>`;
 }
 return html;
}

function predpisHistory(fid){
 const vs=S.versions.filter(v=>String(v.flat)===String(fid)&&/změna od/.test(v.action||''));
 if(!vs.length)return {tag:'',html:''};
 const diffs=(o,n,fmt)=>{const out=[];Object.keys({...o,...n}).forEach(k=>{if(o[k]!==n[k])out.push(`${esc(k)}: ${o[k]!==undefined?kc(o[k]):'—'} → ${n[k]!==undefined?kc(n[k]):'zrušeno'}`)});return out};
 const rows=vs.slice(0,20).map(v=>{
  const parts=[];
  if(v.old&&v.old.rent!==undefined){
   if(v.old.rent!==v.new.rent)parts.push(`nájem: ${kc(v.old.rent)} → ${kc(v.new.rent)}`);
   parts.push(...diffs(v.old.advances||{},v.new.advances||{}));
  }else{
   const o=v.old||{},n=v.new||{};
   parts.push(...diffs(Object.fromEntries(Object.entries(o).filter(([k,x])=>typeof x==='number')),Object.fromEntries(Object.entries(n).filter(([k,x])=>typeof x==='number'))));
  }
  return `<div class="line" style="display:block"><b>${esc(v.name)}</b> <span class="mut small">${esc(v.when)}</span><div class="small">${parts.join('<br>')||'bez rozdílu'}</div></div>`;
 }).join('');
 const last=vs[0].when;
 return {tag:`<span class="tag warn">Předpis měněn ${vs.length}×, naposled ${esc(last)}</span>`,
  html:`<h2>Historie změn předpisu</h2><div class="card">${rows}</div>`};
}

function cmpRows(f,l){
 const norm=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
 const adv=l?Object.keys(l.adv||{}):[];
 const svjNames=[...new Set((f.svj_all||[]).map(c=>c.name))];
 const rows=[],usedAdv=new Set(),usedSvj=new Set();
 (f.cmp_links||[]).forEach(k=>{
  if(!k.adv)return;
  const sv=Array.isArray(k.svj)?k.svj:(k.svj?[k.svj]:[]);
  rows.push({adv:k.adv,svj:sv,bill:k.bill!==false});usedAdv.add(k.adv);sv.forEach(x=>usedSvj.add(x));
 });
 adv.forEach(n=>{
  if(usedAdv.has(n))return;usedAdv.add(n);
  const hit=svjNames.find(s=>!usedSvj.has(s)&&norm(s)===norm(n));
  if(hit)usedSvj.add(hit);
  rows.push({adv:n,svj:hit?[hit]:[],bill:true});
 });
 return rows;
}
function svjPeriods(f,Y){
 const from=`${Y}-01-01`,to=`${Y}-12-31`;const map={};
 (f.svj_all||[]).forEach(c=>{if(c.valid_from&&c.valid_from>to)return;if(c.valid_to&&c.valid_to<from)return;const k=`${c.valid_from||''}|${c.valid_to||''}`;(map[k]=map[k]||{from:c.valid_from,to:c.valid_to,items:[]}).items.push(c)});
 return Object.values(map).sort((x,y)=>String(x.from||'').localeCompare(String(y.from||'')));
}
const cmpNorm=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function leaseAt(f,d){let best=null;(f.leases||[]).forEach(l=>{if((!l.from||l.from<=d)&&(!l.to||l.to>=d)){if(!best||(l.from||'')>(best.from||''))best=l}});return best}
function costsAt(f,d){const by={};(f.svj_all||[]).forEach(c=>{if(c.valid_from&&c.valid_from>d)return;if(c.valid_to&&c.valid_to<d)return;const k=cmpNorm(c.name);if(!by[k]||String(c.valid_from||'')>=String(by[k].valid_from||''))by[k]=c});return Object.values(by)}
function periodBounds(f,Y){
 const y0=`${Y}-01-01`,y1=`${Y}-12-31`;const set=new Set([y0]);
 const add=d=>{if(d&&d>=y0&&d<=y1)set.add(d)};
 (f.leases||[]).forEach(l=>add(l.from));
 (f.svj_all||[]).forEach(c=>{add(c.valid_from);if(c.valid_to){const n=new Date(c.valid_to);n.setDate(n.getDate()+1);add(n.toISOString().slice(0,10))}});
 const arr=[...set].sort();
 const raw=arr.map((st,i)=>({from:st,to:i+1<arr.length?new Date(new Date(arr[i+1]).getTime()-86400000).toISOString().slice(0,10):y1}));
 // Období se stejnými údaji (nájem, zálohy, položky SVJ a jejich částky) se spojí, aby nebyla zbytečná opakování
 const sig=p=>{const l=leaseAt(f,p.from);const c=costsAt(f,p.from).map(x=>cmpNorm(x.name)+'='+(+x.amount||0)).sort().join('|');return JSON.stringify([l?{r:l.rent,a:l.adv}:null,c])};
 const merged=[];
 raw.forEach(p=>{const last=merged[merged.length-1];if(last&&sig(last)===sig(p))last.to=p.to;else merged.push({...p})});
 return merged;
}
function svjOnlyBill(f,name){const e=(f.cmp_links||[]).find(k=>k.svj_only===name);return !!(e&&e.bill)}
async function cmpSave(fid,rows){
 const f=flat(fid);
 const paired=new Set(rows.flatMap(r=>r.svj||[]));
 const links=rows.filter(r=>r.adv).map(r=>({adv:r.adv,svj:r.svj,bill:r.bill}));
 const only=(f?(f.cmp_links||[]):[]).filter(k=>k.svj_only&&!paired.has(k.svj_only));
 const all=[...links,...only];
 if(f)f.cmp_links=all;
 window.CMP_SEL=null;
 render();
 try{await api(`/flats/${fid}/cmp-links`,'PUT',{links:all});await reload();render()}
 catch(e){toast(e.message);await reload();render()}
}
function cmpSvjBill(fid,name,val){
 const f=flat(fid);if(!f)return;
 f.cmp_links=[...(f.cmp_links||[]).filter(k=>k.svj_only!==name),{adv:null,svj_only:name,bill:!!val}];
 cmpSave(fid,cmpRows(f,leaseAt(f,TODAY_ISO())||f.leases[f.leases.length-1]));
}
function cmpChange(fid,mutate){
 const f=flat(fid);if(!f)return;
 const rows=cmpRows(f,leaseAt(f,TODAY_ISO())||f.leases[f.leases.length-1]);
 mutate(rows);cmpSave(fid,rows);
}
function cmpPairName(fid,adv,name){
 cmpChange(fid,rows=>{
  rows.forEach(r=>{r.svj=r.svj.filter(x=>x!==name)});
  let r=rows.find(x=>x.adv===adv);if(!r){r={adv,svj:[],bill:true};rows.push(r)}
  r.svj=[...r.svj,name];
 });
}
function cmpUnpairName(fid,adv,name){cmpChange(fid,rows=>{const r=rows.find(x=>x.adv===adv);if(r)r.svj=r.svj.filter(x=>x!==name)})}
function cmpBillName(fid,adv,val){cmpChange(fid,rows=>{const r=rows.find(x=>x.adv===adv);if(r)r.bill=val;else rows.push({adv,svj:[],bill:val})})}
function cmpDrop(ev,fid,adv){ev.preventDefault();const name=ev.dataTransfer.getData('text/plain');if(name)cmpPairName(fid,adv,name)}
function cmpTap(fid,adv){if(window.CMP_SEL)cmpPairName(fid,adv,window.CMP_SEL)}
function cmpSelect(name){window.CMP_SEL=window.CMP_SEL===name?null:name;render()}
function cmpSections(f,l){
 const rows=cmpRows(f,l);
 const items=f.svj||[];
 const payOf=n=>items.filter(c=>c.name===n).reduce((x,c)=>x+(+c.amount||0),0);
 const has=n=>items.some(c=>c.name===n);
 const pay=items.reduce((x,c)=>x+(+c.amount||0),0);
 const paired=new Set(rows.flatMap(r=>r.svj));
 const unpaired=[...new Set(items.map(c=>c.name))].filter(n=>!paired.has(n));
 const sel=window.CMP_SEL||null;
 const rent=l?(+l.rent||0):0;
 const money=v=>(v>0?'+':'')+kc(v);
 let vyb=rent, corr=0;
 const rentRow=`<tr class="rentRow"><td>Holé nájemné</td><td class="r"><button class="link" onclick="rentEditAny(${f.id})">${kc(rent)}</button></td><td class="mut">—</td><td class="r mut">—</td><td class="r mut">—</td><td class="c"></td></tr>`;
 const tRows=rows.map(r=>{
  const get=(l&&l.adv)?(+l.adv[r.adv]||0):0;
  vyb+=get;
  const inP=r.svj.filter(has);
  const pv=inP.length?inP.reduce((x,n)=>x+payOf(n),0):null;
  const d=(pv||0)-get;
  if(r.bill)corr+=d;
  const pills=r.svj.map(n=>`<span class="pair">${esc(n)} <button class="x" title="Odpárovat" data-adv="${esc(r.adv)}" data-name="${esc(n)}" onclick="event.stopPropagation();cmpUnpairName(${f.id},this.dataset.adv,this.dataset.name)">×</button></span>`).join('');
  const cell=`<div class="pairs">${pills}</div>${r.svj.length?'':`<div class="dropHint">${sel?'Klikněte sem: '+esc(sel):'Přetáhněte sem položku SVJ'}</div>`}`;
  return `<tr><td>${esc(r.adv)}</td><td class="r">${kc(get)}</td>`+
   `<td class="dropCell" data-adv="${esc(r.adv)}" ondragover="event.preventDefault()" ondrop="cmpDrop(event,${f.id},this.dataset.adv)" onclick="cmpTap(${f.id},this.dataset.adv)">${cell}</td>`+
   `<td class="r">${pv==null?'—':kc(pv)}</td><td class="r ${!r.bill?'mut strike':(d<0?'bad':'ok')}">${money(d)}</td>`+
   `<td class="c"><input type="checkbox" title="Počítat do vyúčtování nájemníka" data-adv="${esc(r.adv)}" ${r.bill?'checked':''} onchange="cmpBillName(${f.id},this.dataset.adv,this.checked)"></td></tr>`;
 });
 const sRows=unpaired.map(n=>{
  const amt=payOf(n);
  const on=svjOnlyBill(f,n);
  if(on)corr+=amt;
  return `<tr class="svjOnly" draggable="true" data-name="${esc(n)}" ondragstart="event.dataTransfer.setData('text/plain',this.dataset.name)" onclick="cmpSelect(this.dataset.name)">`+
   `<td class="mut">—</td><td class="r mut">—</td>`+
   `<td><span class="chip2${sel===n?' on':''}">${esc(n)}</span> <span class="mut small">nespárováno</span></td>`+
   `<td class="r">${kc(amt)}</td><td class="r ${on?'ok':'mut strike'}">${money(amt)}</td>`+
   `<td class="c"><input type="checkbox" title="Počítat do vyúčtování: nájemník doplatí podíl na skutečné ceně" data-name="${esc(n)}" ${on?'checked':''} onclick="event.stopPropagation()" onchange="cmpSvjBill(${f.id},this.dataset.name,this.checked)"></td></tr>`;
 });
 const hint=`<div class="mut small" style="margin:6px 0">Do vyúčtování jdou jen zaškrtnuté řádky; přeškrtnuté šedé hodnoty se nepočítají. Záporné = přeplatek, který vracíte nájemníkovi. Kladné = doplatek nájemníka. Celkem odpovídá korekci „Po korekci“ na kartě.</div>`+(unpaired.length?`<div class="mut small" style="margin:0 0 6px">Nespárované položky SVJ jsou dole. Přetáhněte je na řádek nájemníka, nebo na ně klikněte a pak klikněte na řádek.</div>`:'');
 return `<div class="cmpPeriod"><div class="cmpHead">Platný předpis dnes <span class="mut small">· SVJ ${kc(pay)} měsíčně</span></div>${hint}
 <table class="cmp"><thead><tr><th>Nájemník platí</th><th class="r">Vybírám</th><th>Já platím (SVJ)</th><th class="r">Platím</th><th class="r" title="Záporné = přeplatek vracíte, kladné = doplatek nájemníka">Rozdíl</th><th class="c" title="Počítat do vyúčtování">Vyúčt.</th></tr></thead>
 <tbody>${tRows.join('')}${rentRow}${sRows.join('')}<tr class="addRow"><td></td><td></td><td><button class="btn sm sec" onclick="costForm(${f.id})">+ Položka SVJ</button></td><td></td><td></td><td></td></tr><tr class="sumRow"><td>Celkem</td><td class="r">${kc(vyb)}</td><td></td><td class="r">${kc(pay)}</td><td class="r ${corr<0?'bad':'ok'}">${money(corr)}</td><td></td></tr></tbody></table></div>`;
}

// ---------- ekonomika (úvodní obrazovka) ----------
const MONTHS=['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
const monthLabel=p=>{const [y,mm]=p.split('-');return MONTHS[+mm-1]+' '+y};
const STAT={paid:'Zaplaceno',partial:'Částečně',unpaid:'Nezaplaceno',extra:'Bez smlouvy'};
// Matice: řádek = byt (dlaždice), sloupec = měsíc. Šedě = očekávaný nájem, zeleně = spárovaná platba.
function econMatrix(e){
 const ms=e.months;
 const flats=[...S.flats].sort((a,b)=>String(a.addr).localeCompare(String(b.addr),'cs',{numeric:true}));
 if(!flats.length)return '<div class="card mut">Zatím žádné byty.</div>';
 const cellOf=(f,x)=>{
  const r=x.rows.find(q=>q.flat_id===f.id);
  if(!r)return '<div class="ecell empty">—</div>';
  const label={paid:'zaplaceno',partial:'částečně',unpaid:'čeká na platbu',extra:'bez smlouvy'}[r.status];
  const main=(r.status==='partial')?`${kc(r.received)} / ${kc(r.expected)}`:(r.status==='unpaid'?kc(r.expected):kc(r.received||r.expected));
  return `<div class="ecell ${r.status}" title="Očekáváno ${kc(r.expected)}, přišlo ${kc(r.received)}"><b>${main}</b><span>${label}</span></div>`;
 };
 const head=`<div></div>`+ms.map(x=>`<div class="ehead">${monthLabel(x.period)}</div>`).join('');
 const body=flats.map(f=>`<div class="etile" style="--fc:${flatColor(f)}"><b>${esc(f.addr)}</b><span>${esc(f.tenant?.name||'Bez nájemníka')}</span></div>`+ms.map(x=>cellOf(f,x)).join('')).join('');
 return `<div class="ematrix" style="grid-template-columns:210px repeat(${ms.length},minmax(124px,1fr))">${head}${body}</div>`;
}
function econHome(){
 const e=S.econ;if(!e)return '';
 const ms=e.months,cur=ms[ms.length-1].period;
 const head=ms.map(x=>`<th class="r">${monthLabel(x.period)}</th>`).join('');
 const line=(label,fn,cls='')=>`<tr><td>${label}</td>${ms.map(x=>`<td class="r ${cls}">${fn(x)}</td>`).join('')}</tr>`;
 const missingOf=x=>x.rows.filter(r=>r.status==='unpaid'||r.status==='partial');
 const debts=ms.filter(x=>x.period!==cur).map(x=>{
  const rs=missingOf(x);if(!rs.length)return '';
  return `<div class="card"><h3>${monthLabel(x.period)}</h3>${rs.map(r=>`<div class="resRow"><div><b>${esc(r.tenant||r.addr)}</b><div class="small mut">${esc(r.addr)} · ${STAT[r.status]}: chybí ${kc(r.missing)}</div></div><button class="btn sm" onclick="reminderDraft(${r.flat_id},'${x.period}',${r.missing})">Připravit upomínku</button></div>`).join('')}</div>`;
 }).join('');
 const unm=e.unmatched.length?e.unmatched.map(t=>`<div class="card txMiss"><div class="row"><div><b>${kc(t.amount)}</b> · ${fd(t.date)}<div class="small mut">${esc(t.counterparty||'neznámý plátce')}${t.vs?' · VS '+esc(t.vs):''}${t.note?' · '+esc(t.note):''}</div></div></div>
  <div class="grid2"><div><label>Byt</label><select id="ut${t.id}">${flatOpts(null)}</select></div><div style="align-self:end"><button class="btn sm" onclick="assignTx(${t.id})">Přiřadit</button></div></div></div>`).join(''):'<div class="card mut">Všechny platby z výpisů jsou přiřazené.</div>';
 const asg=(e.assigned||[]).map(t=>`<div class="card txOk"><div class="row"><div><b>${kc(t.amount)}</b> · ${fd(t.date)}<div class="small mut">${esc(t.counterparty||'neznámý plátce')}${t.vs?' · VS '+esc(t.vs):''}</div><div class="small">Přiřazeno: <b>${esc(t.flat_addr)}</b></div></div></div>
  <div class="grid2"><div><label>Opravit byt</label><select id="ut${t.id}">${flatOpts(t.flat_id)}</select></div><div style="align-self:end;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="assignTx(${t.id})">Uložit</button><button class="btn sec sm" onclick="assignTx(${t.id},true)">Odpojit</button></div></div></div>`).join('');
 return `<div class="row"><h1>Ekonomika</h1>
  <label style="margin:0;cursor:pointer"><span class="btn sec sm">+ Nahrát výpis (CSV / PDF)</span><input type="file" accept=".csv,.pdf,text/csv,application/pdf" style="display:none" onchange="uploadBank(this)"></label></div>
 <div id="bk" class="small mut"></div>
 <p class="mut small">Očekáváno = předpisy (nájem + zálohy) podle smluv. Přišlo = platby z výpisů přiřazené k bytům.</p>
 ${econMatrix(e)}
 <h2>Souhrn za měsíce</h2>
 <div class="card" style="overflow-x:auto"><table><thead><tr><th></th>${head}</tr></thead><tbody>
  ${line('Očekáváno',x=>kc(x.expected))}
  ${line('Přišlo',x=>kc(x.received))}
  ${line('Rozdíl',x=>(x.received-x.expected>=0?'+':'')+kc(x.received-x.expected),x=>'')}
  ${line('Nezaplaceno bytů',x=>missingOf(x).length)}
  ${line('Nepřiřazeno z výpisu',x=>kc(x.unmatched))}
 </tbody></table></div>
 <h2>Kdo za který měsíc nezaplatil</h2>${debts||'<div class="card mut">Za předchozí měsíce nic nechybí.</div>'}
 <h2>Platby z výpisu k přiřazení</h2>${unm}
 <h2>Přiřazené platby (lze opravit)</h2>
 <p class="mut small">Špatně přiřazenou platbu změňte na správný byt, nebo ji „Odpojit“ a vrátí se mezi nepřiřazené.</p>
 ${asg||'<div class="card mut">Za zobrazené měsíce nejsou žádné přiřazené platby.</div>'}`;
}
async function uploadBank(input){
 const f=input.files[0];input.value='';if(!f)return;
 const box=$('#bk');box.textContent='Čtu výpis…';
 const fd=new FormData();fd.append('file',f);
 try{
  const r=await fetch('/bank/import',{method:'POST',body:fd});
  if(!r.ok){let d='Chyba '+r.status;try{d=(await r.json()).detail||d}catch(e){}throw new Error(d)}
  const j=await r.json();toast(`Přidáno plateb: ${j.added}, už byly: ${j.skipped}`);
  await reload();render();
 }catch(e){toast(e.message);box.textContent=''}
}

// Telefon do mezinárodního tvaru pro WhatsApp a tel: (9místné české číslo dostane předvolbu 420)
function phoneIntl(p){
 let d=(p||'').replace(/\D/g,'');
 if(d.length===9)d='420'+d;
 return d;
}
// Rychlé akce u bytu: volání, WhatsApp, e-mail nájemníka a mapa adresy
function contactButtons(f){
 const ph=phoneIntl(f.tenant.phone), mail=f.tenant.email;
 const addr=[f.addr,f.zip].filter(Boolean).join(', ');
 const st='style="text-decoration:none;display:inline-block"';
 const b=[];
 if(ph)b.push(`<a class="btn sec sm" ${st} href="tel:+${ph}">Zavolat</a>`,
              `<a class="btn sec sm" ${st} href="https://wa.me/${ph}" target="_blank" rel="noopener">WhatsApp</a>`);
 if(mail)b.push(`<a class="btn sec sm" ${st} href="mailto:${esc(mail)}?subject=${encodeURIComponent('Byt '+f.addr)}">Napsat e-mail</a>`);
 if(addr)b.push(`<a class="btn sec sm" ${st} href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}" target="_blank" rel="noopener">Mapa</a>`);
 return b.length?`<div class="btns">${b.join('')}</div>`:'';
}

 <p class="mut small">Čtení z fotky nebo PDF je zatím simulované. Porovnání a uložení už běží na serveru.</p>

 <label>Rok, ke kterému dokument patří</label><input type="number" id="uy" value="${V.year||new Date().getFullYear()-1}">
 <label>Ukázkový výsledek čtení</label>
 <select id="um"><option value="same">Stejný dokument (bez rozdílů)</option><option value="changed">Upravený dokument (jiná Správa domu)</option></select>
 <div class="btns"><button class="btn" onclick="readDoc(${fid})">Přečíst a porovnat</button></div>
 <div id="res"></div>`);
}
async function readDoc(fid){
 const f=flat(fid),y=+$('#uy').value,mode=$('#um').value;
 const base=f.years[y]?f.years[y].items:null;
 if(!base){$('#res').innerHTML=`<div class="card mut" style="margin-top:12px">Pro rok ${y} zatím nejsou uložená data. Vyúčtování tohoto roku se zatím nedá porovnat.</div>`;return}
 const items=base.map(r=>[r[0],+r[1],+r[2]]);
 if(mode==='changed'){const i=items.findIndex(r=>r[0]==='Správa domu');if(i>=0)items[i][1]+=26.92}
 const body={items:items.map(([n,c,p])=>({name:n,cost:String(Math.round(c*100)/100),paid:String(Math.round(p*100)/100)}))};
 try{
  const cmp=await api(`/flats/${fid}/statements/${y}/compare`,'POST',body);
  const diffs=cmp.diffs.filter(d=>d.status==='changed');
  pending={fid,y,items:body.items,diffs,decisions:{}};
  if(!diffs.length){$('#res').innerHTML=`<div class="card ok" style="margin-top:12px">Dokument se shoduje s uloženými údaji. Nic se nemění.</div>`;return}
  renderDiffs();
 }catch(e){toast(e.message)}
}
function renderDiffs(){
 const p=pending;
 $('#res').innerHTML=`<div class="card" style="margin-top:12px;border-color:var(--warn)">
  <h3 class="warn">Našel jsem ${p.diffs.length} rozdíl(y) oproti vyúčtování ${p.y}</h3>
  <p class="small mut">Starší hodnota se uloží do historie a dá se vrátit.</p>
  ${p.diffs.map((d,i)=>{const dec=p.decisions[d.name];return `<div class="resRow"><div><b>${esc(d.name)}</b><div class="small mut">Uloženo ${kc(d.stored.cost)} → v dokumentu ${kc(d.extracted.cost)}</div></div>
   <div class="btns" style="margin:0"><button class="btn sm ${dec==='replace'?'':'sec'}" onclick="decide(${i},'replace')">Nahradit novým</button><button class="btn sm ${dec==='keep'?'':'sec'}" onclick="decide(${i},'keep')">Ponechat starý</button></div></div>`}).join('')}
  <div class="btns"><button class="btn sec sm" onclick="decideAll('keep')">Ponechat všechny</button><button class="btn sm sec" onclick="decideAll('replace')">Nahradit všechny</button></div>
  <div class="btns"><button class="btn" onclick="applyDecisions()">Uložit rozhodnutí</button></div>
 </div>`;
}
function decide(i,c){pending.decisions[pending.diffs[i].name]=c;renderDiffs()}
function decideAll(c){pending.diffs.forEach(d=>pending.decisions[d.name]=c);renderDiffs()}
async function applyDecisions(){
 const p=pending;
 if(p.diffs.some(d=>!p.decisions[d.name])){toast('Nejdřív rozhodněte u všech rozdílů');return}
 try{
  await api(`/flats/${p.fid}/statements/${p.y}/resolve`,'POST',{doc_label:'Nahráno ručně',items:p.items,decisions:p.decisions});
  closeModal();toast('Uloženo, starší hodnoty jsou v historii');
  await reload();render();
 }catch(e){toast(e.message)}
}

// Přepočet při změně osob, čistého nájmu nebo fondu oprav
function ctScaleAdv(){
 const n=+$('#ct_npers')?.value||0, base=CT_BASE_N||n;
 const lines=Object.entries(CT_BASE_ADV).map(([k,v])=>{
  const water=WATER_RE.test(k)&&!NOT_WATER_RE.test(k);
  const val=water&&n>0&&base>0?Math.round(v*n/base):v;
  return `${k}: ${val}`;
 }).join('\n');
 if($('#ct_adv'))$('#ct_adv').value=lines;
}
function ctCalc(e,fid){
 const id=e&&e.target&&e.target.id;
 if(id==='ct_npers')ctScaleAdv();
 if((id==='ct_npers'||id==='ct_net'||id==='ct_fund')&&$('#ct_net')){
  const net=$('#ct_net').value.trim();
  if(net!=='')$('#ct_rent').value=Math.round((+net||0)+(+$('#ct_fund').value||0));
 }
 if($('#ct_sum')){
  const rent=+$('#ct_rent')?.value||0, adv=parseAdvText($('#ct_adv')?.value);
  const as=Object.values(adv).reduce((a,b)=>a+(+b||0),0);
  $('#ct_sum').innerHTML=`Nájemné bez záloh ${kc(rent)} + zálohy ${kc(as)} = <b>${kc(rent+as)}</b> měsíčně.`;
 }
 ctRefresh(fid);
}
function ctText(fid){
 const f=flat(fid),l=f.leases[f.leases.length-1]||{rent:0,deposit:0,kauce:0,adv:{},from:'',to:''};
 const t=$('#ct').value, dod=t==='dodatek';
 const on=id=>!dod||$('#on_'+id).checked;
 const eff=$('#ct_eff').value;
 if(dod&&!eff){toast('Vyplňte, od kdy dodatek platí');return null}
 const dt=d=>d?fd(d):'[doplňte]';
 const parseAdv=txt=>{const o={};(txt||'').split('\n').forEach(line=>{const i=line.lastIndexOf(':');if(i<0)return;const k=line.slice(0,i).trim(),v=parseFloat(line.slice(i+1).replace(/\s/g,'').replace(',','.'));if(k&&!isNaN(v))o[k]=v});return o};
 const advNew=on('adv')?parseAdv($('#ct_adv')?.value):(l.adv||{});
 const advList=Object.entries(advNew).map(([k,v])=>`${k}: ${kc(v)}`).join('; ')||'[doplňte]';
 const advSum=Object.values(advNew).reduce((a,b)=>a+(+b||0),0);
 const rent=on('rent')?(+$('#ct_rent')?.value||0):(+l.rent||0);
 const deposit=on('deposit')?(+$('#ct_deposit')?.value||0):(+l.deposit||l.kauce||0);
 const from=on('term')?$('#ct_from')?.value:(l.from||'');
 const to=on('term')?$('#ct_to')?.value:(l.to||'');
 const other=on('other')?($('#ct_other')?.value||'').trim():'';
 const clauses=[];
 let n=0;
 const clause=(title,body)=>{n++;clauses.push(`Čl. ${n} ${title}\n${body}`)};
 if(dod){
  if(on('rent')&&rent!==(+l.rent||0))clause('Výše nájmu',`Nájemné bez záloh se od ${dt(eff)} mění z ${kc(l.rent)} na ${kc(rent)} měsíčně.`);
  if(on('adv'))clause('Zálohy na služby',`Měsíční zálohy na služby se od ${dt(eff)} mění takto: ${advList}. Celkem ${kc(advSum)} měsíčně.`);
  if(on('term'))clause('Doba nájmu',`Nájem se od ${dt(eff)} mění tak, že trvá od ${dt(from)} do ${to?dt(to):'neurčité doby'}.`);
  if(on('deposit')&&deposit!==(+l.deposit||+l.kauce||0))clause('Kauce',`Výše kauce se mění z ${kc(l.deposit||l.kauce)} na ${kc(deposit)}.`);
  if(on('other')&&other)clause('Jiná ujednání',other);
  if(!clauses.length){toast('Vyberte aspoň jednu změnu');return null}
  clauses.push(`Čl. ${n+1} Závěrečná ustanovení\nOstatní ustanovení smlouvy zůstávají beze změny. Dodatek je vyhotoven ve dvou stejnopisech a nabývá platnosti dnem podpisu obou smluvních stran, nejdříve však ${dt(eff)}.`);
 }else{
  clause('Předmět nájmu',`Pronajímatel přenechává nájemci do nájmu byt ${f.addr}, ${f.dispo||''}, ${f.zip||''}.`);
  clause('Doba nájmu',`Nájem trvá od ${dt(eff||from)} do ${to?dt(to):'neurčité doby'}.`);
  clause('Nájemné',`Nájemné bez záloh činí ${kc(rent)} měsíčně, splatné nejpozději k 25. dni měsíce na účet ${f.bank?.acc||'[doplňte]'}.`);
  clause('Zálohy na služby',`Měsíční zálohy na služby: ${advList}. Celkem ${kc(advSum)} měsíčně.`);
  clause('Kauce',`Nájemce skládá kauci ve výši ${kc(deposit)}.`);
  if(other)clause('Jiná ujednání',other);
 }
 const head=dod?`DODATEK č. [doplňte] KE SMLOUVĚ O NÁJMU BYTU ze dne [doplňte]`:(t==='vypoved'?'VÝPOVĚĎ NÁJMU BYTU':'SMLOUVA O NÁJMU BYTU');
 return `${head}

Pronajímatel: ${(LANDLORD_DEF&&LANDLORD_DEF.name)||f.owner||'[doplňte]'}
Nájemce: ${f.tenant.name||'[doplňte]'}
Byt: ${f.addr}, ${f.dispo||''}, ${f.zip||''}

${clauses.join('\n\n')}

V ${(f.zip||'').split(' ').slice(-2).join(' ')||'[místo]'} dne ${fd(TODAY)}

______________________          ______________________
Pronajímatel                     Nájemce`;
}

 };
 if(dod&&!body.eff_date){toast('Vyplňte, od kdy dodatek platí');return}

    <button class="btn sec" onclick="closeModal();render()">Hotovo</button>
   </div>`);
 }catch(e){progress('');toast(e.message)}

async function wzReadDoc(input){
 const files=[...input.files];input.value='';
 if(!files.length)return;
 const fd=new FormData();files.forEach(f=>fd.append('files',f));fd.append('flat_id',W.fid);
 progress('Čtu doklad…');
 try{
  const r=await fetch('/tenants/read-id',{method:'POST',body:fd});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.detail)||('Chyba '+r.status));
  progress('');
  W.docRead+=files.length;
  const f=j.fields||{};
  ['name','birth_date','address','id_number'].forEach(k=>{if(f[k])W.docFields[k]=f[k]});
  W.pendingPerson={name:W.docFields.name||'',birth:W.docFields.birth_date||'',address:W.docFields.address||'',op:W.docFields.id_number||''};
  W.pendingRole=W.docTarget==='cohab'?'cohab':'main';
  wzGo('confirm_person');
 }catch(e){progress('');toast(e.message)}
}

function ctRefresh(fid){
 const box=$('#ctDiff');if(!box)return;
 const f=flat(fid),l=f.leases[f.leases.length-1]||{rent:0,deposit:0,kauce:0,adv:{},from:'',to:''};
 const dod=$('#ct').value==='dodatek';
 const rows=[];
 const newRent=+$('#ct_rent')?.value||0, oldRent=+l.rent||0;
 const newDep=+$('#ct_deposit')?.value||0, oldDep=+(l.deposit||l.kauce)||0;
 const newAdv=parseAdvText($('#ct_adv')?.value), oldAdv=l.adv||{};
 const newFrom=$('#ct_from')?.value||'', newTo=$('#ct_to')?.value||'';
 const diffKeys=new Set();
 if(newRent&&newRent!==oldRent){diffKeys.add('rent');const pct=oldRent?` (${(((newRent-oldRent)/oldRent)*100).toFixed(1)} %)`:'';rows.push(`Nájem: ${kc(oldRent)} → ${kc(newRent)}${pct}`)}
 const advLines=[];
 Object.keys(newAdv).forEach(k=>{if(!(k in oldAdv))advLines.push(`přibyla záloha „${k}“ ${kc(newAdv[k])}`);else if(+oldAdv[k]!==newAdv[k])advLines.push(`„${k}“: ${kc(oldAdv[k])} → ${kc(newAdv[k])}`)});
 Object.keys(oldAdv).forEach(k=>{if(!(k in newAdv))advLines.push(`zrušena záloha „${k}“ (bylo ${kc(oldAdv[k])})`)});
 if(advLines.length){diffKeys.add('adv');advLines.forEach(x=>rows.push('Zálohy: '+x))}
 if(newDep&&newDep!==oldDep){diffKeys.add('deposit');rows.push(`Kauce: ${kc(oldDep)} → ${kc(newDep)}`)}
 if(newFrom&&newFrom!==(l.from||'')){diffKeys.add('term');rows.push(`Začátek nájmu: ${fd(l.from)} → ${fd(newFrom)}`)}
 if(newTo!==(l.to||'')){diffKeys.add('term');rows.push(`Konec nájmu: ${l.to?fd(l.to):'neurčitě'} → ${newTo?fd(newTo):'neurčitě'}`)}
 if(dod)diffKeys.forEach(k=>{const cb=$('#on_'+k);if(cb&&!cb.checked){cb.checked=true;$('#sec_'+k).style.display='block'}});
 box.innerHTML=rows.length
  ?`<div class="card" style="margin-top:12px"><b>Návrh změn oproti předchozí smlouvě</b><ul style="margin:8px 0 0;padding-left:18px">${rows.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><div class="small mut" style="margin-top:6px">${dod?'Změněné body jsou zaškrtnuté. Zkontrolujte je před uložením.':'Nová smlouva nahrazuje předchozí. Zkontrolujte, že údaje sedí.'}</div></div>`
  :`<div class="small mut" style="margin-top:12px">Oproti předchozí smlouvě se nic nemění.</div>`;
}

// Podpis: ťuknutím na políčko se otevře velká plocha přes celou obrazovku
const SIG={};
function sigPad(id){
 return `<div id="box_${id}" onclick="sigOpen('${id}')" style="height:110px;border:1px dashed var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#888;overflow:hidden">Ťuknutím podepište</div>`;
}
function sigOpen(id){
 const ov=document.createElement('div');ov.id='sigOv';
 ov.style.cssText='position:fixed;inset:0;background:var(--paper);z-index:300;display:flex;flex-direction:column;padding:14px;gap:10px';
 ov.innerHTML=`<div class="row"><b>Podpis</b><span class="mut small">Podepište se prstem nebo perem</span></div>
  <canvas id="sigCv" style="flex:1;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none"></canvas>
  <div class="btns" style="margin:0;justify-content:space-between"><button class="btn sec" onclick="sigCancel()">Zrušit</button><button class="btn sec" onclick="sigWipe()">Smazat</button><button class="btn" onclick="sigSave('${id}')">Uložit podpis</button></div>`;
 document.body.appendChild(ov);
 const c=document.getElementById('sigCv');
 c.width=c.clientWidth*2;c.height=c.clientHeight*2;
 const ctx=c.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#111';
 let down=false,last=null;
 const pos=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};
 c.addEventListener('pointerdown',e=>{down=true;last=pos(e);c.setPointerCapture(e.pointerId)});
 c.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
 const end=()=>{down=false};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function sigWipe(){const c=document.getElementById('sigCv');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function sigCancel(){const ov=document.getElementById('sigOv');if(ov)ov.remove()}
function sigSave(id){
 const c=document.getElementById('sigCv');
 const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
 let has=false;for(let i=3;i<d.length;i+=4)if(d[i]>0){has=true;break}
 if(!has){toast('Nejdřív se podepište');return}
 SIG[id]=c.toDataURL('image/png');
 const box=document.getElementById('box_'+id);
 if(box)box.innerHTML=`<img src="${SIG[id]}" style="max-height:100%;max-width:100%">`;
 sigCancel();
}
function sigInit(id){}
function sigClear(id){delete SIG[id];const box=document.getElementById('box_'+id);if(box)box.innerHTML='Ťuknutím podepište'}
function sigData(id){return SIG[id]||null}

const dmy=s=>s?s.split('-').reverse().join('. ')+'.':'';
const chgColor=v=>v>=0?'#86EFAC':'#FCA5A5';
function valueTrendChart(){
 if(!PORT){if(!PORT_LOADING)loadPortfolio().then(render);return `<div class="card mut small">Načítám vývoj hodnoty…</div>`}
 const h=(PORT.history||[]).filter(x=>x.total>0);
 if(!h.length)return `<h2>Vývoj hodnoty portfolia</h2><div class="card chartCard mut small">Graf se zaplní po prvním měsíčním snímku. Aktuální odhad: ${kc(PORT.total)}.</div>`;
 const W=600,H=200,pad=34;
 const vals=h.map(x=>x.total), min=Math.min(...vals), max=Math.max(...vals);
 const span=(max-min)||Math.max(1,max*0.05), lo=min-span*0.15, hi=max+span*0.15;
 const X=i=>h.length===1?W/2:pad+i*(W-2*pad)/(h.length-1), Y=v=>H-pad-(v-lo)/(hi-lo)*(H-2*pad);
 const pts=h.map((x,i)=>`${X(i).toFixed(1)},${Y(x.total).toFixed(1)}`).join(' ');
 const area=`${X(0).toFixed(1)},${H-pad} ${pts} ${X(h.length-1).toFixed(1)},${H-pad}`;
 const n=h.length, mx=(n-1)/2, my=vals.reduce((a,b)=>a+b,0)/n;
 let num=0,den=0;h.forEach((x,i)=>{num+=(i-mx)*(x.total-my);den+=(i-mx)**2});
 const slope=den?num/den:0;
 const t0=Y(my+slope*(0-mx)), t1=Y(my+slope*((n-1)-mx));
 const grid=[0,1,2,3].map(g=>{const y=pad+g*(H-2*pad)/3;return `<line x1="${pad}" x2="${W-pad}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 6"/>`}).join('');
 const labels=h.map((x,i)=>`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--mut)">${x.date.slice(5)}</text>`).join('');
 const dots=h.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.total)}" r="4" fill="#22C55E"><title>${x.date}: ${kc(x.total)}</title></circle>`).join('');
 const last=vals[n-1], first=vals[0];
 const chg=first?((last-first)/first*100):null;
 return `<h2>Vývoj hodnoty portfolia</h2><div class="card chartCard">
  <div class="row" style="margin-bottom:6px"><b style="font-size:22px">${kc(last)}</b><span class="tag ${slope>=0?'ok':'bad'}">${slope>=0?'▲':'▼'} trend ${kc(slope)} / měs.${chg!=null?` · od začátku ${chg>=0?'+':''}${chg.toFixed(1).replace('.',',')} %`:''}</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Vývoj hodnoty portfolia" style="display:block;overflow:visible">
   <defs><linearGradient id="vtA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22C55E" stop-opacity=".45"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></linearGradient>
   <filter id="vtG" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
   ${grid}
   <polygon points="${area}" fill="url(#vtA)"/>
   <polyline points="${pts}" fill="none" stroke="#22C55E" stroke-width="3" stroke-linejoin="round" filter="url(#vtG)"/>
   <line x1="${X(0)}" y1="${t0}" x2="${X(n-1)}" y2="${t1}" stroke="#8B7CFF" stroke-width="2" stroke-dasharray="6 6"/>
   ${dots}${labels}
  </svg>
  <div class="mut small" style="text-align:center;margin-top:6px">Součet hodnot všech bytů: poslední zadaná nebo odhadnutá hodnota k danému dni. Fialová čára je trend.</div>
 </div>`;
}

// Velké fotky zmenšíme, ať se rychleji nahrají a levněji přečtou
async function shrink(file){
 if(!file.type.startsWith('image/'))return file;
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
 const k=Math.min(1,2000/Math.max(img.width,img.height));
 const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
 return new File([blob],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'});
}

function progress(t){

 if(!t){if(b)b.remove();return}
 if(!b){b=document.createElement('div');b.id='upBar';
  b.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:92vw;background:#2f5d50;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  document.body.appendChild(b)}
 b.textContent=t;
}

// Společné nahrávání pro tlačítka, přetažení i Ctrl+V. flatId vyplněné = dokumenty rovnou patří k bytu
async function uploadFiles(all,flatId,groupKey){
 const files=all.filter(f=>/^(image\/(jpeg|png|gif|webp)|application\/pdf|application\/vnd\.openxmlformats-officedocument\.wordprocessingml\.document)$/.test(f.type)||/\.(pdf|jpe?g|png|webp|gif|docx)$/i.test(f.name));
 // Víc fotek najednou je jeden vícestránkový dokument: spojí se do jednoho PDF
 const imgs=files.filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|webp|gif)$/i.test(f.name));
 if(imgs.length>1&&!groupKey){
  const key=newKey();
  progress(`Nahrávám ${imgs.length} stránek jako jeden dokument…`);
  try{
   for(const f of imgs){const fd=new FormData();fd.append('files',await shrink(f).catch(()=>f));if(flatId)fd.append('flat_id',flatId);fd.append('group_key',key);
    const res=await fetch('/documents',{method:'POST',body:fd});if(!res.ok){let d='Chyba '+res.status;try{d=(await res.json()).detail||d}catch(e){}throw new Error(d)}}
   await api(`/document-groups/${key}/finish`,'POST');
   toast(`Dokument vytvořen z ${imgs.length} stránek`);
  }catch(e){toast(e.message)}
  progress('');
  const rest=files.filter(f=>!imgs.includes(f));
  if(rest.length)return uploadFiles(rest,flatId);
  await reload();render();return;
 }
 const skipped=all.length-files.length;
 if(!files.length){toast('Žádný podporovaný soubor (PDF nebo obrázek)');return}
 let ok=0,fail=0;const created=[];
 // posíláme po jednom souboru, ať je vidět průběh a jeden pomalý soubor nic nezastaví
 for(let i=0;i<files.length;i++){
  progress(`Nahrávám a čtu ${i+1} z ${files.length}: ${files[i].name}`);
  try{
   const fd=new FormData();
   fd.append('files',await shrink(files[i]).catch(()=>files[i]));
   if(flatId)fd.append('flat_id',flatId);
   if(groupKey)fd.append('group_key',groupKey);
   const res=await fetch('/documents',{method:'POST',body:fd});
   if(!res.ok){let d='Chyba '+res.status;try{d=(await res.json()).detail||d}catch(e){}throw new Error(d)}
   const got=await res.json().catch(()=>[]);if(Array.isArray(got))created.push(...got);
   ok++;
  }catch(e){fail++;toast(files[i].name+': '+e.message)}
 }
 progress('');
 toast(`Nahráno ${ok}${fail?', chyb '+fail:''}${skipped?', přeskočeno '+skipped:''}`);
 await reload();render();
 const yr=created.filter(d=>d.doc_type==='vyuctovani_svj');
 if(yr.length)yearAsk(yr);
}

 const y=d.year||(new Date().getFullYear()-1);
 modal(`<div class="sheetHead"><h2>K jakému roku patří vyúčtování?</h2><button class="btn sec sm" onclick="closeModal()">Zavřít</button></div>
  <p class="small mut">${esc(d.filename)} · čtení odhadlo rok ${d.year||'nezjištěn'}. Změňte ho, pokud je to jinak.</p>
  <label>Rok</label><input type="number" id="zy" value="${y}">
  <p class="small mut">Položky se zapíšou do tohoto roku a změněné hodnoty se přepíšou. Starší zůstanou v historii. Ostatní roky se nemění.${YQ.length?` Potom se zeptám na další dokument (zbývá ${YQ.length}).`:''}</p>
  <div class="btns"><button class="btn" onclick="yearAssign(${d.id})">Zařadit do roku</button><button class="btn sec" onclick="yearAskNext()">Přeskočit</button></div>`);
}
async function yearAssign(id){
 const y=+$('#zy').value;
 try{await api(`/documents/${id}/zaradit-rok`,'POST',{year:y});toast(`Zařazeno do roku ${y}`);await reload();render();yearAskNext()}catch(e){toast(e.message)}
}
// Přetažení a Ctrl+V: na kartě bytu se dokument zařadí k tomuto bytu, v Dokumentech bez přiřazení
function dropTarget(){
 if(V.tab==='flat'&&V.flat)return {flatId:V.flat};
 if(V.tab==='docs')return {flatId:null};
 return null;
}
function dropHint(on,text){
 let h=$('#dropHint');
 if(!on){if(h)h.remove();return}
 if(!h){h=document.createElement('div');h.id='dropHint';
  h.style.cssText='position:fixed;inset:12px;border:3px dashed #2f5d50;border-radius:16px;background:rgba(47,93,80,.10);z-index:98;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#2f5d50;pointer-events:none';
  document.body.appendChild(h)}
 h.textContent=text;
}
const hasFiles=e=>!!(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'));
let dragDepth=0;
window.addEventListener('dragenter',e=>{
 if(!hasFiles(e))return;
 e.preventDefault();dragDepth++;
 dropHint(true,dropTarget()?'Pusťte soubory sem':'Nejdřív otevřete byt nebo Dokumenty');
});
window.addEventListener('dragover',e=>{
 if(!hasFiles(e))return;
 e.preventDefault();e.dataTransfer.dropEffect=dropTarget()?'copy':'none';
});
window.addEventListener('dragleave',e=>{
 if(!hasFiles(e))return;
 dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)dropHint(false);
});
window.addEventListener('drop',e=>{
 if(!hasFiles(e))return;
 e.preventDefault();dragDepth=0;dropHint(false);
 const t=dropTarget();
 if(!t){toast('Nejdřív otevřete byt nebo Dokumenty');return}
 uploadFiles([...e.dataTransfer.files],t.flatId);
});
window.addEventListener('paste',e=>{
 const files=[...((e.clipboardData&&e.clipboardData.files)||[])];
 if(!files.length)return; // obyčejný text necháme být
 const t=dropTarget();
 if(!t){toast('Nejdřív otevřete byt nebo Dokumenty');return}
 e.preventDefault();
 uploadFiles(files,t.flatId);
});

// ---------- sdílení dokumentu (WhatsApp, Messenger, e-mail… přes systémový výběr telefonu) ----------
const SHARE_CACHE={};
async function docFile(id){
 if(SHARE_CACHE[id])return SHARE_CACHE[id];
 const res=await fetch(`/documents/${id}/file`);
 if(!res.ok)throw new Error('Soubor se nepodařilo načíst');
 const blob=await res.blob();
 const d=S.docs.find(x=>x.id===id);
 const f=new File([blob],d?d.filename:'dokument',{type:blob.type||(d&&d.mime)||'application/octet-stream'});
 SHARE_CACHE[id]=f;
 return f;
}
async function shareDoc(id){
 const d=S.docs.find(x=>x.id===id);
 let f;
 try{ f=await docFile(id) }catch(e){ toast(e.message); return }
 if(navigator.canShare&&navigator.canShare({files:[f]})){
  try{ await navigator.share({files:[f],title:f.name,text:(d&&d.summary)||f.name}); return }
  catch(e){ if(e.name==='AbortError')return; toast('Klepněte na Sdílet ještě jednou'); return }
 }
 // Telefon neumí sdílet soubory přímo: uložíme ho do souborů
 const url=URL.createObjectURL(f);
 const a=document.createElement('a');a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);
 toast('Soubor se uložil, sdílejte ho z downloadů');
}

// ---------- stránky jednoho dokumentu (více fotek = jedno PDF) ----------
// flatId: číslo bytu, null = bez přiřazení, 'all' = všechny skupiny (Dokumenty)
function pendingGroups(flatId){
 const by={};
 for(const d of S.docs){
  if(d.status!=='rozpracováno'||!d.group_key)continue;
  if(flatId!=='all'&&(d.flat_id??null)!==(flatId??null))continue;
  const g=by[d.group_key]||(by[d.group_key]={key:d.group_key,flat_id:d.flat_id??null,pages:0});
  g.pages++;
 }
 return Object.values(by);
}
const stranky=n=>n===1?'stránka':(n>=2&&n<=4?'stránky':'stránek');
function pendingBanner(gs){
 return gs.map(g=>`<div class="card pend"><div class="row"><div><b>Je to všechno?</b><div class="small mut">Rozpracovaný dokument: ${g.pages} ${stranky(g.pages)}${g.flat_id?'':' · zatím bez bytu'}. Nic se ještě nečte, dokud to nepotvrdíte.</div></div></div>
  <div class="btns" style="margin:10px 0 0">${pageLabel(g.flat_id,g.key,'📷 Ne, vyfotit další stránku','btn sm sec')}<button class="btn sm" onclick="finishGroup('${g.key}')">Ano, vytvořit PDF</button><button class="btn sm sec" onclick="cancelGroup('${g.key}')">Zrušit</button></div></div>`).join('');
}
function newKey(){ return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2) }
// Klíč rozpracovaného dokumentu pro byt (nebo nový)
function pendKey(flatId){ const g=pendingGroups(flatId===undefined?null:flatId)[0]; return g?g.key:newKey() }
// Štítek, který je zároveň tlačítko: iOS otevře výběr fotek přímo, bez JavaScriptu
function pageLabel(flatId,key,text,cls,extra){
 const fid=(flatId===null||flatId===undefined)?'null':flatId;
 return `<label class="${cls}" style="display:inline-block;cursor:pointer;${extra||''}">${text}<input type="file" accept="image/*" multiple style="display:none" onchange="pagesPicked(this,${fid},'${key}')"></label>`;
}
function pagesPicked(input,flatId,key){
 const files=[...input.files];
 input.value='';
 if(files.length)uploadFiles(files,flatId,key);
}
async function finishGroup(key){
 const n=S.docs.filter(d=>d.group_key===key).length;
 if(!confirm(`Spojit ${n} ${stranky(n)} do jednoho PDF a přečíst ho celý najednou?`))return;
 progress('Spojuji stránky do PDF a čtu dokument…');
 try{ await api(`/document-groups/${key}/finish`,'POST'); toast('Dokument vytvořen a přečten') }
 catch(e){ toast(e.message) }
 progress('');
 await reload(); render();
}
async function cancelGroup(key){
 if(!confirm('Zrušit rozpracovaný dokument? Nahrané stránky se smažou.'))return;
 try{ await api(`/document-groups/${key}`,'DELETE') }catch(e){ toast(e.message) }
 await reload(); render();
}

// Přečte znovu všechny dokumenty: doplní nová pole (dispozice, PSČ, kontakty, účet) a přepočítá přiřazení
async function reloadAllFlats(){
 if(!confirm('Přepočítat údaje všech bytů z dokumentů? Údaje doplněné z dokumentů se načtou znovu, ruční údaje zůstanou.'))return;
 try{const r=await api('/flats/reload-docs','POST');toast(`Přepočítáno ${r.bytů} bytů`);await reload()}catch(e){toast(e.message)}
}
async function reloadFlatDocs(fid){
 if(!confirm('Přepočítat údaje tohoto bytu z dokumentů? Údaje doplněné z dokumentů se načtou znovu, ruční údaje zůstanou.'))return;
 try{const r=await api(`/flats/${fid}/reload-docs`,'POST');toast(`Přepočítáno z ${r.dokumentů} dokumentů`);await reload()}catch(e){toast(e.message)}
}
async function rereadAll(){ return rereadIds(S.docs.filter(d=>d.status!=='rozpracováno').map(d=>d.id),'Přečíst znovu') }
async function rereadFlat(flatId){ return rereadIds(S.docs.filter(d=>d.flat_id===flatId&&d.status!=='rozpracováno').map(d=>d.id),'Přečíst znovu dokumenty tohoto bytu') }
async function rereadIds(ids,title){
 if(!ids.length){toast('Zatím nejsou žádné dokumenty');return}
 if(!confirm(`${title}: ${ids.length} dokumentů? Typ a údaje se přepočítají, ruční přiřazení k bytu zůstane.`))return;
 let ok=0,fail=0;
 for(let i=0;i<ids.length;i++){
  progress(`Čtu znovu ${i+1} z ${ids.length}`);
  try{await api(`/documents/${ids[i]}/classify`,'POST');ok++}catch(e){fail++;toast(e.message)}
 }
 progress('');
 toast(`Přečteno ${ok}${fail?', chyb '+fail:''}`);
 await reload();render();
}

// Verze nasazení: zjistí se při otevření a pak jen na přání kliknutím na tlačítko MG vpravo nahoře.
// Žádné průběžné dotazy na server.
let BUILD=null;
async function fetchBuild(){
 const r=await fetch('/version',{cache:'no-store'});
 if(!r.ok)throw new Error('Verze nejde zjistit');
 return (await r.json()).version;
}
// Vrátí se na přehled, zkontroluje verzi a případně stránku obnoví
async function checkForUpdate(){
 go('home');
 try{
  const v=await fetchBuild();
  if(BUILD===null||v===BUILD){BUILD=v;toast('Máte nejnovější verzi');return}
  location.reload();
 }catch(e){toast(e.message)}
}
fetchBuild().then(v=>{BUILD=v}).catch(()=>{});

async function confirmDoc(id){
 let fid=$('#df'+id).value;const t=$('#dt'+id).value;
 try{
  if(fid==='new'){
   const d=S.docs.find(x=>x.id==id),ex=d.extracted||{};
   const nf=await api('/flats','POST',{addr:ex.address,tenant:{name:ex.tenant_name||''}});
   fid=nf.id;
  }
  await api(`/documents/${id}`,'PATCH',{flat_id:fid?+fid:null,doc_type:t});toast('Zařazeno');await reload();render()}
 catch(e){toast(e.message)}
}
async function classifyDoc(id){
 progress('Čtu dokument… může to trvat půl minuty');
 try{
  const r=await api(`/documents/${id}/classify`,'POST');
  progress('');
  toast(r.note?'Nepodařilo se přečíst: '+r.note:'Přečteno: '+(DOC_TYPES[r.doc_type]||r.doc_type));
  await reload();render();
 }catch(e){progress('');toast('Chyba čtení: '+e.message)}
}
async function deleteDoc(id){
 if(!confirm('Smazat dokument?'))return;
 try{await api(`/documents/${id}`,'DELETE');toast('Smazáno');await reload();render()}catch(e){toast(e.message)}
}

// ---------- režim zobrazení ----------
function currentTheme(){return document.documentElement.dataset.theme||'dark'}
function updateThemeBtn(){const b=$('#themeBtn');if(b)b.textContent=currentTheme()==='dark'?'☀ Světlý režim':'☾ Noční režim'}
function toggleTheme(){
 const next=currentTheme()==='dark'?'light':'dark';
 document.documentElement.dataset.theme=next;
 try{localStorage.setItem('sb-theme',next)}catch(e){}
 updateThemeBtn();
}

// ---------- start ----------
(async()=>{
 try{const t=localStorage.getItem('sb-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
 updateThemeBtn();
 try{await reload()}catch(e){toast(e.message)}
 render();
})();
</script>
