<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2029"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- jemná mřížka -->
  <g stroke="#2a313d" stroke-width="4">
    <line x1="64" y1="176" x2="448" y2="176"/>
    <line x1="64" y1="336" x2="448" y2="336"/>
  </g>
  <!-- svíčky -->
  <g stroke-linecap="round">
    <line x1="132" y1="128" x2="132" y2="300" stroke="#eb5a5a" stroke-width="10"/>
    <rect x="108" y="160" width="48" height="100" rx="8" fill="#eb5a5a"/>
    <line x1="220" y1="190" x2="220" y2="372" stroke="#eb5a5a" stroke-width="10"/>
    <rect x="196" y="224" width="48" height="110" rx="8" fill="#eb5a5a"/>
    <line x1="308" y1="160" x2="308" y2="360" stroke="#50c878" stroke-width="10"/>
    <rect x="284" y="200" width="48" height="128" rx="8" fill="#50c878"/>
    <line x1="396" y1="96" x2="396" y2="288" stroke="#50c878" stroke-width="10"/>
    <rect x="372" y="124" width="48" height="128" rx="8" fill="#50c878"/>
  </g>
  <!-- křížení Stochasticu: %K (zlatá) protíná %D (modrá) zdola -->
  <path d="M64 330 C 150 310, 190 440, 262 410 S 380 250, 448 214" fill="none" stroke="#5aa0ff" stroke-width="16" stroke-linecap="round"/>
  <path d="M64 380 C 140 440, 200 470, 252 430 S 360 200, 448 168" fill="none" stroke="#fad264" stroke-width="20" stroke-linecap="round"/>
</svg>
