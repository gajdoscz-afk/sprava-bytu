services:
  - type: web
    name: sprava-bytu
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: sprava-bytu-db
          property: connectionString
      - key: BASIC_USER
        sync: false
      - key: BASIC_PASS
        sync: false

databases:
  - name: sprava-bytu-db
    region: frankfurt
    plan: basic-256mb
